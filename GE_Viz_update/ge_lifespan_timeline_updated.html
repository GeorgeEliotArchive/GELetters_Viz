<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>George Eliot's Network: Lifespan Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f0ea;color:#3d3229;font-family:'DM Sans',sans-serif;}
.page{max-width:960px;margin:0 auto;padding:20px 24px 40px;}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;align-items:center;}
.toggle-wrap{display:flex;background:rgba(61,50,41,0.08);border-radius:22px;padding:3px;gap:2px;}
.toggle-btn{padding:6px 14px;font-size:11px;font-family:'DM Sans',sans-serif;border:none;border-radius:20px;cursor:pointer;background:transparent;color:rgba(61,50,41,0.65);font-weight:400;transition:all 0.2s;}
.toggle-btn.active{background:#3d3229;color:#f5f0ea;font-weight:600;}
.search-input{padding:5px 12px;font-size:11px;font-family:'DM Sans';border:1px solid rgba(61,50,41,0.2);border-radius:16px;background:#faf6f1;color:#3d3229;outline:none;width:150px;}
.chart-box{background:#faf6f1;border:1px solid rgba(61,50,41,0.12);border-radius:4px;padding:10px 10px 6px;overflow-x:auto;}
.legend{display:flex;justify-content:center;gap:14px;margin-top:10px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(61,50,41,0.6);}
.legend-dot{width:9px;height:9px;border-radius:50%;}
.tt{position:fixed;pointer-events:none;background:#3d3229;color:#f5f0ea;padding:8px 12px;border-radius:4px;font-size:11px;line-height:1.5;max-width:280px;z-index:1000;opacity:0;transition:opacity .1s;box-shadow:0 3px 14px rgba(0,0,0,0.22);}
.tt .tt-t{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:600;margin-bottom:2px;}
.tt .tt-m{opacity:0.6;font-size:10px;}
</style></head><body>
<div class="page">
<div class="controls">
  <div class="toggle-wrap">
    <button class="toggle-btn active" data-sort="closeness">Sort by Closeness</button>
    <button class="toggle-btn" data-sort="birth">Sort by Birth Year</button>
    <button class="toggle-btn" data-sort="alpha">Sort A–Z</button>
  </div>
  <div class="toggle-wrap">
    <button class="toggle-btn active" data-filter="all">All</button>
    <button class="toggle-btn" data-filter="family">Family</button>
    <button class="toggle-btn" data-filter="friend">Friends</button>
  </div>
  <input class="search-input" type="text" placeholder="Search name..." id="searchBox">
</div>
<div class="chart-box"><canvas id="timeline"></canvas></div>
<div class="legend" id="legend"></div>
</div>
<div class="tt" id="tooltip"></div>
<script>
const RAW=[{"n": "Edward Beesly", "b": 1831, "d": 1915, "c": 8, "r": "friend"}, {"n": "John Blackwood", "b": 1818, "d": 1879, "c": 3, "r": "friend"}, {"n": "William Blackwood", "b": 1776, "d": 1834, "c": 9, "r": "friend"}, {"n": "Barbara Bodichon", "b": 1827, "d": 1891, "c": 2, "r": "friend"}, {"n": "Cara Bray", "b": 1814, "d": 1905, "c": 2, "r": "friend"}, {"n": "Charles Bray", "b": 1811, "d": 1894, "c": 3, "r": "friend"}, {"n": "Robert Brabant", "b": 1781, "d": 1866, "c": 3, "r": "friend"}, {"n": "Oscar Browning", "b": 1837, "d": 1923, "c": 6, "r": "friend"}, {"n": "Robert Browning", "b": 1812, "d": 1889, "c": 8, "r": "friend"}, {"n": "Edward Burne-Jones", "b": 1833, "d": 1898, "c": 6, "r": "friend"}, {"n": "Georgiana Burne-Jones", "b": 1840, "d": 1920, "c": 3, "r": "friend"}, {"n": "Frederic Burton", "b": 1816, "d": 1900, "c": 6, "r": "friend"}, {"n": "Wathen Call", "b": 1817, "d": 1890, "c": 7, "r": "friend"}, {"n": "Jane Carlyle", "b": 1801, "d": 1866, "c": 7, "r": "friend"}, {"n": "Thomas Carlyle", "b": 1795, "d": 1881, "c": 7, "r": "friend"}, {"n": "John Chapman", "b": 1821, "d": 1894, "c": 3, "r": "friend"}, {"n": "Andrew Clark", "b": 1826, "d": 1893, "c": 7, "r": "friend"}, {"n": "Chrissey Clarke", "b": 1814, "d": 1859, "c": 3, "r": "family"}, {"n": "Edward Clarke", "b": 1809, "d": 1852, "c": 8, "r": "family"}, {"n": "Emily Clarke", "b": 1844, "d": 1924, "c": 4, "r": "family"}, {"n": "George Combe", "b": 1788, "d": 1858, "c": 5, "r": "friend"}, {"n": "Maria Congreve", "b": 1846, "d": 1915, "c": 2, "r": "friend"}, {"n": "Richard Congreve", "b": 1818, "d": 1899, "c": 5, "r": "friend"}, {"n": "Eleanor Cross", "b": 1847, "d": 1895, "c": 4, "r": "family"}, {"n": "Florence Cross", "b": 1848, "d": 1907, "c": 3, "r": "family"}, {"n": "John Cross", "b": 1840, "d": 1915, "c": 1, "r": "family"}, {"n": "Mary Cross", "b": 1843, "d": 1902, "c": 4, "r": "family"}, {"n": "William Cross", "b": 1838, "d": 1916, "c": 5, "r": "family"}, {"n": "Anna Cross", "b": 1813, "d": 1878, "c": 4, "r": "family"}, {"n": "Emily Cross", "b": 1848, "d": 1907, "c": 4, "r": "family"}, {"n": "John Dalberg-Acton", "b": 1834, "d": 1902, "c": 7, "r": "friend"}, {"n": "Francois D'Albert-Durade", "b": 1804, "d": 1886, "c": 3, "r": "friend"}, {"n": "Julie D'Albert-Durade", "b": 1800, "d": 1880, "c": 4, "r": "friend"}, {"n": "Emily Davies", "b": 1830, "d": 1921, "c": 4, "r": "friend"}, {"n": "Emmanuel Deutsch", "b": 1829, "d": 1873, "c": 6, "r": "friend"}, {"n": "Charles Dickens", "b": 1812, "d": 1870, "c": 7, "r": "friend"}, {"n": "Anna Druce", "b": 1841, "d": 1921, "c": 4, "r": "family"}, {"n": "Christiana Evans", "b": 1788, "d": 1836, "c": 4, "r": "family"}, {"n": "Elizabeth Evans", "b": 1766, "d": 1849, "c": 5, "r": "family"}, {"n": "Isaac Evans", "b": 1816, "d": 1890, "c": 3, "r": "family"}, {"n": "Robert Evans", "b": 1773, "d": 1849, "c": 2, "r": "family"}, {"n": "Samuel Evans", "b": 1777, "d": 1858, "c": 5, "r": "family"}, {"n": "Helen Faucit", "b": 1817, "d": 1898, "c": 6, "r": "friend"}, {"n": "Annie Fields", "b": 1834, "d": 1915, "c": 8, "r": "friend"}, {"n": "James Fields", "b": 1817, "d": 1881, "c": 8, "r": "friend"}, {"n": "James Froude", "b": 1818, "d": 1894, "c": 9, "r": "friend"}, {"n": "Elizabeth Gaskell", "b": 1810, "d": 1865, "c": 9, "r": "friend"}, {"n": "Edmund Gurney", "b": 1847, "d": 1888, "c": 5, "r": "friend"}, {"n": "Edward Hamley", "b": 1824, "d": 1894, "c": 9, "r": "friend"}, {"n": "Ethel Harrison", "b": 1851, "d": 1916, "c": 7, "r": "friend"}, {"n": "Frederic Harrison", "b": 1831, "d": 1923, "c": 7, "r": "friend"}, {"n": "Arthur Helps", "b": 1813, "d": 1875, "c": 7, "r": "friend"}, {"n": "Charles Hennell", "b": 1809, "d": 1850, "c": 4, "r": "friend"}, {"n": "Sara Hennell", "b": 1812, "d": 1899, "c": 2, "r": "friend"}, {"n": "Octavia Hill", "b": 1838, "d": 1912, "c": 6, "r": "friend"}, {"n": "Fanny Houghton", "b": 1805, "d": 1882, "c": 4, "r": "family"}, {"n": "Richard Houghton", "b": 1809, "d": 1885, "c": 5, "r": "friend"}, {"n": "Thornton Hunt", "b": 1810, "d": 1873, "c": 7, "r": "friend"}, {"n": "Thomas Huxley", "b": 1825, "d": 1895, "c": 8, "r": "friend"}, {"n": "Owen Jones", "b": 1809, "d": 1874, "c": 7, "r": "friend"}, {"n": "Benjamin Jowett", "b": 1817, "d": 1893, "c": 5, "r": "friend"}, {"n": "Joseph Langford", "b": 1809, "d": 1884, "c": 8, "r": "friend"}, {"n": "Samuel Laurence", "b": 1812, "d": 1844, "c": 8, "r": "friend"}, {"n": "Frederic Lehmann", "b": 1826, "d": 1891, "c": 6, "r": "friend"}, {"n": "Nina Lehmann", "b": 1830, "d": 1903, "c": 6, "r": "friend"}, {"n": "Fredric Leighton", "b": 1830, "d": 1896, "c": 5, "r": "friend"}, {"n": "Agnes Lewes", "b": 1822, "d": 1902, "c": 5, "r": "family"}, {"n": "Blanche Lewes", "b": 1872, "d": 1964, "c": 5, "r": "family"}, {"n": "Charles Lewes", "b": 1842, "d": 1891, "c": 2, "r": "family"}, {"n": "Elizabeth Lewes", "b": 1787, "d": 1870, "c": 4, "r": "family"}, {"n": "George Lewes", "b": 1817, "d": 1878, "c": 1, "r": "family"}, {"n": "Gertrude Lewes", "b": 1837, "d": 1918, "c": 4, "r": "family"}, {"n": "Bertie Lewes", "b": 1846, "d": 1875, "c": 4, "r": "family"}, {"n": "Thornie Lewes", "b": 1844, "d": 1869, "c": 2, "r": "family"}, {"n": "Maria Lewis", "b": 1800, "d": 1887, "c": 4, "r": "friend"}, {"n": "Joseph Liggins", "b": 1800, "d": 1872, "c": 9, "r": "friend"}, {"n": "Eliza Linton", "b": 1822, "d": 1898, "c": 4, "r": "friend"}, {"n": "Edward Lytton", "b": 1803, "d": 1873, "c": 7, "r": "friend"}, {"n": "Edward Lytton", "b": 1831, "d": 1891, "c": 4, "r": "friend"}, {"n": "Alexander Main", "b": 1841, "d": 1918, "c": 5, "r": "friend"}, {"n": "Harriet Martineau", "b": 1802, "d": 1876, "c": 6, "r": "friend"}, {"n": "James Martineau", "b": 1805, "d": 1900, "c": 9, "r": "friend"}, {"n": "John Mill", "b": 1806, "d": 1873, "c": 8, "r": "friend"}, {"n": "John Morley", "b": 1838, "d": 1923, "c": 7, "r": "friend"}, {"n": "Frederic Myers", "b": 1843, "d": 1901, "c": 6, "r": "friend"}, {"n": "Florence Nightingale", "b": 1820, "d": 1910, "c": 7, "r": "friend"}, {"n": "Charles Norton", "b": 1827, "d": 1908, "c": 7, "r": "friend"}, {"n": "Richard Owen", "b": 1804, "d": 1892, "c": 7, "r": "friend"}, {"n": "James Paget", "b": 1814, "d": 1899, "c": 4, "r": "friend"}, {"n": "Bessie Parkes", "b": 1829, "d": 1925, "c": 3, "r": "friend"}, {"n": "Joseph Parkes", "b": 1796, "d": 1865, "c": 5, "r": "friend"}, {"n": "Edward Pigott", "b": 1824, "d": 1895, "c": 9, "r": "friend"}, {"n": "John Sibree", "b": 1795, "d": 1877, "c": 4, "r": "friend"}, {"n": "Henry Sidgwick", "b": 1838, "d": 1900, "c": 4, "r": "friend"}, {"n": "Edith Simcox", "b": 1844, "d": 1901, "c": 3, "r": "friend"}, {"n": "George Smith", "b": 1841, "d": 1909, "c": 5, "r": "friend"}, {"n": "Herbert Spencer", "b": 1820, "d": 1903, "c": 2, "r": "friend"}, {"n": "Charles Stoddard", "b": 1843, "d": 1909, "c": 9, "r": "friend"}, {"n": "Harriet Stowe", "b": 1811, "d": 1896, "c": 5, "r": "friend"}, {"n": "Elma Stuart", "b": 1837, "d": 1903, "c": 2, "r": "friend"}, {"n": "Clementia Taylor", "b": 1810, "d": 1908, "c": 5, "r": "friend"}, {"n": "Alfred Tennyson", "b": 1809, "d": 1892, "c": 5, "r": "friend"}, {"n": "Anthony Trollope", "b": 1815, "d": 1882, "c": 5, "r": "friend"}, {"n": "Thomas Trollope", "b": 1810, "d": 1892, "c": 4, "r": "friend"}, {"n": "John Tyndall", "b": 1820, "d": 1893, "c": 6, "r": "friend"}, {"n": "Karl Varnhagen von Ense", "b": 1785, "d": 1858, "c": 6, "r": "friend"}, {"n": "Elizabeth Ward", "b": 1844, "d": 1911, "c": 6, "r": "friend"}, {"n": "William White", "b": 1831, "d": 1913, "c": 4, "r": "friend"}];

const GE_BIRTH=1819, GE_DEATH=1880;
const CLOSE_COLORS={1:"#e6308a",2:"#e6308a",3:"#f57600",4:"#f57600",5:"#009eb0",6:"#009eb0",7:"#5928ed",8:"#5928ed",9:"#5e041a",10:"#5e041a"};
const TIER_LABELS=[{color:"#e6308a",l:"Very Close"},{color:"#f57600",l:"Close"},{color:"#009eb0",l:"Moderate"},{color:"#5928ed",l:"Distant"},{color:"#5e041a",l:"Very Distant"}];

let sortMode="closeness", filterMode="all", search="";
const canvas=document.getElementById("timeline");
const ctx=canvas.getContext("2d");
const tt=document.getElementById("tooltip");
const dpr=window.devicePixelRatio||1;
const ROW_H=16, PAD={t:30,r:20,b:20,l:200};
let hitAreas=[];

// Legend
const legend=document.getElementById("legend");
TIER_LABELS.forEach(t=>{
  const d=document.createElement("div");d.className="legend-item";
  d.innerHTML='<div class="legend-dot" style="background:'+t.color+'"></div>'+t.l;
  legend.appendChild(d);
});
// Add GE lifespan to legend
const geDiv=document.createElement("div");geDiv.className="legend-item";
geDiv.innerHTML='<div style="width:20px;height:9px;background:rgba(61,50,41,0.08);border:1px solid rgba(61,50,41,0.15);border-radius:2px;"></div>Eliot\'s lifetime (1819–1880)';
legend.appendChild(geDiv);

// Controls
document.querySelectorAll("[data-sort]").forEach(btn=>{
  btn.onclick=()=>{sortMode=btn.dataset.sort;document.querySelectorAll("[data-sort]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");draw();}
});
document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.onclick=()=>{filterMode=btn.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");draw();}
});
document.getElementById("searchBox").oninput=function(){search=this.value.toLowerCase();draw();};

function getFiltered(){
  let d=RAW.filter(p=>filterMode==="all"||p.r===filterMode);
  if(search)d=d.filter(p=>p.n.toLowerCase().includes(search));
  if(sortMode==="closeness")d.sort((a,b)=>a.c-b.c||a.b-b.b);
  else if(sortMode==="birth")d.sort((a,b)=>a.b-b.b);
  else d.sort((a,b)=>a.n.localeCompare(b.n));
  return d;
}

function draw(){
  const data=getFiltered();
  const n=data.length;
  const h=PAD.t+n*ROW_H+PAD.b;
  const w=canvas.parentElement.getBoundingClientRect().width-20;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  canvas.width=w*dpr;canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const minY=1770, maxY=1970;
  const pW=w-PAD.l-PAD.r;
  const xOf=yr=>PAD.l+(yr-minY)/(maxY-minY)*pW;

  // GE lifespan band
  ctx.fillStyle="rgba(61,50,41,0.06)";
  ctx.fillRect(xOf(GE_BIRTH),PAD.t-4,xOf(GE_DEATH)-xOf(GE_BIRTH),n*ROW_H+8);
  ctx.strokeStyle="rgba(61,50,41,0.12)";ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(xOf(GE_BIRTH),PAD.t-4);ctx.lineTo(xOf(GE_BIRTH),PAD.t+n*ROW_H+4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xOf(GE_DEATH),PAD.t-4);ctx.lineTo(xOf(GE_DEATH),PAD.t+n*ROW_H+4);ctx.stroke();
  ctx.setLineDash([]);

  // GE labels
  ctx.fillStyle="rgba(61,50,41,0.35)";ctx.font="9px 'DM Sans'";ctx.textAlign="center";
  ctx.fillText("GE born 1819",xOf(GE_BIRTH),PAD.t-8);
  ctx.fillText("GE died 1880",xOf(GE_DEATH),PAD.t-8);

  // Year gridlines
  ctx.fillStyle="rgba(61,50,41,0.25)";ctx.font="9px 'DM Sans'";ctx.textAlign="center";
  for(let yr=1780;yr<=1960;yr+=20){
    const x=xOf(yr);
    ctx.strokeStyle="rgba(61,50,41,0.05)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,PAD.t+n*ROW_H);ctx.stroke();
    ctx.fillText(yr,x,h-6);
  }

  // Bars
  hitAreas=[];
  data.forEach((p,i)=>{
    const y=PAD.t+i*ROW_H;
    const x1=Math.max(xOf(p.b), PAD.l), x2=xOf(p.d);
    const barH=ROW_H-4;
    const color=CLOSE_COLORS[p.c]||"#999";

    // Name label
    ctx.fillStyle=search&&p.n.toLowerCase().includes(search)?"#3d3229":"rgba(61,50,41,0.6)";
    ctx.font=(search&&p.n.toLowerCase().includes(search)?"600 ":"")+"10px 'DM Sans'";
    ctx.textAlign="right";
    ctx.fillText(p.n,PAD.l-8,y+barH/2+3);

    // Bar
    ctx.fillStyle=color;
    ctx.globalAlpha=0.75;
    ctx.beginPath();
    ctx.roundRect(x1,y+1,x2-x1,barH,2);
    ctx.fill();
    ctx.globalAlpha=1;

    // Family marker (slightly thicker border)
    if(p.r==="family"){
      ctx.strokeStyle=color;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(x1,y+1,x2-x1,barH,2);ctx.stroke();
    }

    hitAreas.push({x1,x2,y:y+1,h:barH,p});
  });
}

// Tooltip
canvas.onmousemove=function(e){
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let found=null;
  for(const h of hitAreas){
    if(mx>=h.x1&&mx<=h.x2&&my>=h.y&&my<=h.y+h.h){found=h.p;break;}
  }
  if(!found){for(const h of hitAreas){if(my>=h.y&&my<=h.y+h.h){found=h.p;break;}}}
  if(found){
    const tier=found.c<=2?"Very Close":found.c<=4?"Close":found.c<=6?"Moderate":found.c<=8?"Distant":"Very Distant";
    const overlap=Math.max(0,Math.min(found.d,GE_DEATH)-Math.max(found.b,GE_BIRTH));
    tt.innerHTML='<div class="tt-t">'+found.n+'</div><div class="tt-m">'+found.b+'–'+found.d+' (age '+( found.d-found.b)+')</div><div class="tt-m">'+tier+' · '+found.r+'</div><div class="tt-m">'+overlap+' years overlapping with Eliot</div>';
    tt.style.opacity=1;
    const tx=e.clientX+12;
    tt.style.left=(tx+280>window.innerWidth?e.clientX-290:tx)+"px";
    tt.style.top=(e.clientY-10)+"px";
  } else {tt.style.opacity=0;}
};
canvas.onmouseleave=function(){tt.style.opacity=0;};

window.addEventListener("resize",draw);
draw();
</script></body></html>
