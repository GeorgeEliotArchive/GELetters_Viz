<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>George Eliot Letters: Comparison</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f0ea;color:#3d3229;font-family:'DM Sans',sans-serif;}
.page{max-width:920px;margin:0 auto;padding:12px 8px 16px;display:flex;flex-direction:column;align-items:center;}
.controls{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.toggle-wrap{display:flex;background:rgba(61,50,41,0.08);border-radius:22px;padding:3px;gap:2px;}
.toggle-btn{padding:6px 16px;font-size:11.5px;font-family:'DM Sans',sans-serif;border:none;border-radius:20px;cursor:pointer;background:transparent;color:rgba(61,50,41,0.65);font-weight:400;transition:all 0.2s;}
.toggle-btn.active{background:#3d3229;color:#f5f0ea;font-weight:600;}
.filter-btn{padding:5px 11px;font-size:10.5px;font-family:'DM Sans',sans-serif;border:1px solid rgba(61,50,41,0.2);border-radius:16px;cursor:pointer;background:transparent;color:rgba(61,50,41,0.55);font-weight:400;}
.filter-btn.active{border:1.5px solid #3d3229;background:rgba(61,50,41,0.07);color:#3d3229;font-weight:600;}
.search-input{padding:5px 12px;font-size:11px;font-family:'DM Sans';border:1px solid rgba(61,50,41,0.2);border-radius:16px;background:#faf6f1;color:#3d3229;outline:none;width:150px;}
.chart-box{background:#faf6f1;border:1px solid rgba(61,50,41,0.12);border-radius:4px;padding:2px 2px 0;width:100%;max-width:888px;position:relative;}
.chart-box svg{display:block;margin:0 auto;}
.dir-labels{display:flex;justify-content:space-between;padding:1px 44px 6px;font-size:11px;color:#3d3229;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;}
.size-legend{display:flex;align-items:flex-end;gap:12px;margin-top:10px;}
.size-legend .lbl{font-size:10px;color:rgba(61,50,41,0.5);}
.size-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
.size-item span{font-size:8.5px;color:rgba(61,50,41,0.45);}
.color-legend{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap;}
.color-item{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(61,50,41,0.6);}
.color-dot{width:9px;height:9px;border-radius:50%;}
</style></head><body>
<div class="page">
<div class="controls">
  <div class="toggle-wrap">
    <button class="toggle-btn active" data-mode="scholars">Perceived Closeness</button>
    <button class="toggle-btn" data-mode="letters">Letter Volume</button>
  </div>
  <div id="filters" style="display:flex;gap:4px;"></div>
  <input class="search-input" type="text" placeholder="Search name..." id="searchBox">
</div>
<div class="chart-box">
  <svg id="chart"></svg>
  <div class="dir-labels"><span id="dirLeft"></span><span id="dirRight"></span></div>
</div>
<div class="size-legend" id="sizeLegend"><span class="lbl">Bubble size = letters:</span></div>
<div class="color-legend" id="colorLegend"></div>
</div>
<script>
const RAW=[{"name":"John Blackwood","closeness":3,"letters":211,"rel":"friend"},{"name":"William Blackwood","closeness":9,"letters":48,"rel":"friend"},{"name":"Barbara Bodichon","closeness":2,"letters":144,"rel":"friend"},{"name":"Cara Bray [Mrs. Charles Bray]","closeness":2,"letters":136,"rel":"friend"},{"name":"Charles Bray","closeness":3,"letters":136,"rel":"friend"},{"name":"Oscar Browning","closeness":6,"letters":18,"rel":"friend"},{"name":"Robert Browning","closeness":8,"letters":3,"rel":"friend"},{"name":"Edward Burne-Jones","closeness":6,"letters":24,"rel":"friend"},{"name":"Georgiana Burne-Jones","closeness":3,"letters":24,"rel":"friend"},{"name":"Elizabeth Call","closeness":5,"letters":3,"rel":"friend"},{"name":"Wathen Call","closeness":7,"letters":3,"rel":"friend"},{"name":"Mary Cash","closeness":6,"letters":7,"rel":"friend"},{"name":"John Chapman","closeness":3,"letters":43,"rel":"friend"},{"name":"Susanna Chapman","closeness":8,"letters":43,"rel":"friend"},{"name":"Andrew Clark","closeness":7,"letters":2,"rel":"friend"},{"name":"Christiana Clarke","closeness":3,"letters":2,"rel":"family"},{"name":"Edward Clarke","closeness":8,"letters":2,"rel":"family"},{"name":"Emily Clarke","closeness":4,"letters":2,"rel":"family"},{"name":"George Combe","closeness":5,"letters":39,"rel":"friend"},{"name":"Maria Congreve","closeness":2,"letters":75,"rel":"friend"},{"name":"Richard Congreve","closeness":5,"letters":75,"rel":"friend"},{"name":"Eleanor Cross","closeness":4,"letters":7,"rel":"family"},{"name":"Florence Cross","closeness":3,"letters":2,"rel":"family"},{"name":"John Cross","closeness":1,"letters":20,"rel":"family"},{"name":"Mary Cross","closeness":4,"letters":6,"rel":"family"},{"name":"William Cross","closeness":5,"letters":18,"rel":"family"},{"name":"Anna Cross","closeness":4,"letters":20,"rel":"family"},{"name":"Emily Cross","closeness":4,"letters":1,"rel":"family"},{"name":"Francois D'Albert-Durade","closeness":3,"letters":24,"rel":"friend"},{"name":"Julie D'Albert-Durade","closeness":4,"letters":24,"rel":"friend"},{"name":"Emily Davies","closeness":4,"letters":14,"rel":"friend"},{"name":"Emmanuel Deutsch","closeness":6,"letters":7,"rel":"friend"},{"name":"Charles Dickens","closeness":7,"letters":1,"rel":"friend"},{"name":"Anna Druce","closeness":4,"letters":3,"rel":"family"},{"name":"Christiana Evans","closeness":4,"letters":7,"rel":"family"},{"name":"Elizabeth Evans","closeness":5,"letters":7,"rel":"family"},{"name":"Harriet Evans","closeness":9,"letters":7,"rel":"family"},{"name":"Isaac Evans","closeness":3,"letters":4,"rel":"family"},{"name":"Robert Evans","closeness":2,"letters":7,"rel":"family"},{"name":"Samuel Evans","closeness":5,"letters":2,"rel":"family"},{"name":"Sarah Evans","closeness":5,"letters":7,"rel":"family"},{"name":"Annie Fields","closeness":8,"letters":3,"rel":"friend"},{"name":"James Fields","closeness":8,"letters":3,"rel":"friend"},{"name":"James Froude","closeness":9,"letters":1,"rel":"friend"},{"name":"Elizabeth Gaskell","closeness":9,"letters":1,"rel":"friend"},{"name":"Edward Hamley","closeness":9,"letters":1,"rel":"friend"},{"name":"Ethel Harrison","closeness":7,"letters":42,"rel":"friend"},{"name":"Frederic Harrison","closeness":7,"letters":42,"rel":"friend"},{"name":"Alice Helps","closeness":4,"letters":11,"rel":"friend"},{"name":"Arthur Helps","closeness":7,"letters":1,"rel":"friend"},{"name":"Charles Hennell","closeness":4,"letters":1,"rel":"friend"},{"name":"Sara Hennell","closeness":2,"letters":343,"rel":"friend"},{"name":"Octavia Hill","closeness":6,"letters":1,"rel":"friend"},{"name":"Thomas Huxley","closeness":8,"letters":1,"rel":"friend"},{"name":"Martha Jackson","closeness":5,"letters":21,"rel":"friend"},{"name":"Owen Jones","closeness":7,"letters":24,"rel":"friend"},{"name":"Benjamin Jowett","closeness":5,"letters":2,"rel":"friend"},{"name":"Joseph Langford","closeness":8,"letters":12,"rel":"friend"},{"name":"Samuel Laurence","closeness":8,"letters":1,"rel":"friend"},{"name":"Frederic Lehmann","closeness":6,"letters":6,"rel":"friend"},{"name":"Nina Lehmann","closeness":6,"letters":6,"rel":"friend"},{"name":"Agnes Lewes","closeness":5,"letters":55,"rel":"family"},{"name":"Blanche Lewes","closeness":5,"letters":1,"rel":"family"},{"name":"Charles Lewes","closeness":2,"letters":55,"rel":"family"},{"name":"Elizabeth Lewes","closeness":4,"letters":55,"rel":"family"},{"name":"George Lewes","closeness":1,"letters":55,"rel":"family"},{"name":"Gertrude Lewes","closeness":4,"letters":55,"rel":"family"},{"name":"Herbert Lewes","closeness":4,"letters":55,"rel":"family"},{"name":"Thornton Lewes","closeness":2,"letters":55,"rel":"family"},{"name":"Maria Lewis","closeness":4,"letters":52,"rel":"friend"},{"name":"Alexander Main","closeness":5,"letters":23,"rel":"friend"},{"name":"John Mill","closeness":8,"letters":6,"rel":"friend"},{"name":"John Morley","closeness":7,"letters":2,"rel":"friend"},{"name":"Frederic Myers","closeness":6,"letters":6,"rel":"friend"},{"name":"Florence Nightingale","closeness":7,"letters":1,"rel":"friend"},{"name":"Richard Owen","closeness":7,"letters":1,"rel":"friend"},{"name":"Elizabeth Parkes","closeness":3,"letters":49,"rel":"friend"},{"name":"Joseph Parkes","closeness":5,"letters":49,"rel":"friend"},{"name":"Mark Pattison","closeness":8,"letters":32,"rel":"friend"},{"name":"Edward Pigott","closeness":9,"letters":2,"rel":"friend"},{"name":"John Sibree","closeness":4,"letters":5,"rel":"friend"},{"name":"George Simpson","closeness":9,"letters":3,"rel":"friend"},{"name":"George Smith","closeness":5,"letters":17,"rel":"friend"},{"name":"Herbert Spencer","closeness":2,"letters":8,"rel":"friend"},{"name":"Elma Stuart","closeness":2,"letters":54,"rel":"friend"},{"name":"Clementia Taylor","closeness":5,"letters":37,"rel":"friend"},{"name":"Alfred Tennyson","closeness":5,"letters":1,"rel":"friend"},{"name":"Eleanor Tennyson","closeness":7,"letters":1,"rel":"friend"},{"name":"Anthony Trollope","closeness":5,"letters":2,"rel":"friend"},{"name":"Thomas Trollope","closeness":4,"letters":8,"rel":"friend"},{"name":"Elizabeth Ward","closeness":6,"letters":24,"rel":"friend"}];

const LETTER_BINS=[{label:"100+",min:100,pos:1.5},{label:"30–99",min:30,pos:3.5},{label:"10–29",min:10,pos:5.5},{label:"3–9",min:3,pos:7.5},{label:"1–2",min:1,pos:9.5}];
function letterBinPos(n){for(const b of LETTER_BINS)if(n>=b.min)return b.pos;return 9.5;}

const W=880,H=480;
const PAD={t:16,r:40,b:60,l:40};
const PW=W-PAD.l-PAD.r,PH=H-PAD.t-PAD.b;
const xScale=d3.scaleLinear().domain([0.5,10.5]).range([0,PW]);
const rScale=d3.scaleSqrt().domain([1,343]).range([4,38]);

const CLOSE_COLORS={1:"#e6308a",2:"#e6308a",3:"#f57600",4:"#f57600",5:"#009eb0",6:"#009eb0",7:"#5928ed",8:"#5928ed",9:"#5e041a",10:"#5e041a"};

const SCHOLAR_LABELS=[{x:1.5,label:"Very Close"},{x:3.5,label:"Close"},{x:5.5,label:"Moderate"},{x:7.5,label:"Distant"},{x:9.5,label:"Very Distant"}];
const LETTER_LABELS=[{x:1.5,label:"100+ Letters",sub:"Heavy"},{x:3.5,label:"30–99 Letters",sub:"Frequent"},{x:5.5,label:"10–29 Letters",sub:"Moderate"},{x:7.5,label:"3–9 Letters",sub:"Occasional"},{x:9.5,label:"1–2 Letters",sub:"Rare"}];

const familyCount=RAW.filter(d=>d.rel==="family").length;
const friendCount=RAW.filter(d=>d.rel==="friend").length;

let mode="scholars",relFilter="all",search="",hoveredId=null;

//Filter buttons
const filtersDiv=document.getElementById("filters");
[{key:"all",label:"All ("+RAW.length+")"},{key:"friend",label:"Friends ("+friendCount+")"},{key:"family",label:"Family ("+familyCount+")"}].forEach(f=>{
  const btn=document.createElement("button");
  btn.className="filter-btn"+(f.key==="all"?" active":"");
  btn.textContent=f.label;
  btn.dataset.filter=f.key;
  btn.onclick=()=>{relFilter=f.key;document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();};
  filtersDiv.appendChild(btn);
});

//Toggle buttons
document.querySelectorAll(".toggle-btn").forEach(btn=>{
  btn.onclick=()=>{
    mode=btn.dataset.mode;
    document.querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    nodes.forEach(d=>{d.targetX=mode==="scholars"?xScale(d.closeness):xScale(letterBinPos(d.letters));});
    sim.force("x",d3.forceX(d=>d.targetX).strength(0.8));
    sim.alpha(0.6).restart();
    updateLabels();
  };
});

//Search
document.getElementById("searchBox").oninput=function(){search=this.value.toLowerCase();render();};

//Size legend
const sizeLeg=document.getElementById("sizeLegend");
[343,200,75,20,1].forEach(n=>{
  const div=document.createElement("div");div.className="size-item";
  const r=rScale(n);
  div.innerHTML='<svg width="'+(r*2+4)+'" height="'+(r*2+4)+'"><circle cx="'+(r+2)+'" cy="'+(r+2)+'" r="'+r+'" fill="rgba(61,50,41,0.15)" stroke="rgba(61,50,41,0.25)" stroke-width="1"/></svg><span>'+n+'</span>';
  sizeLeg.appendChild(div);
});

//Color legend
const colorLeg=document.getElementById("colorLegend");
[{color:"#e6308a",l:"Very Close"},{color:"#f57600",l:"Close"},{color:"#009eb0",l:"Moderate"},{color:"#5928ed",l:"Distant"},{color:"#5e041a",l:"Very Distant"}].forEach(x=>{
  const div=document.createElement("div");div.className="color-item";
  div.innerHTML='<div class="color-dot" style="background:'+x.color+'"></div>'+x.l;
  colorLeg.appendChild(div);
});

//SVG setup
const svg=d3.select("#chart").attr("width",W).attr("height",H);
const g=svg.append("g").attr("transform","translate("+PAD.l+","+PAD.t+")");
const bgLayer=g.append("g");
const labelLayer=g.append("g");
const lineEl=g.append("line").attr("y1",PH+6).attr("y2",PH+6).attr("stroke","rgba(61,50,41,0.12)").attr("stroke-width",1);
const dimLayer=g.append("g");
const dotLayer=g.append("g");
const tipLayer=g.append("g").attr("pointer-events","none");

function isVisible(d){return(!search||d.name.toLowerCase().includes(search))&&(relFilter==="all"||d.rel===relFilter);}

//Init nodes
const nodes=RAW.map((d,i)=>({...d,id:i,r:rScale(d.letters),targetX:xScale(d.closeness),x:xScale(d.closeness)+(Math.random()-0.5)*10,y:PH/2+(Math.random()-0.5)*60}));

const sim=d3.forceSimulation(nodes)
  .force("x",d3.forceX(d=>d.targetX).strength(0.8))
  .force("y",d3.forceY(PH/2).strength(0.04))
  .force("collide",d3.forceCollide(d=>d.r+1.5).strength(0.7))
  .alphaDecay(0.025)
  .on("tick",render);

function updateLabels(){
  const labels=mode==="scholars"?SCHOLAR_LABELS:LETTER_LABELS;
  document.getElementById("dirLeft").textContent=mode==="scholars"?"\u2190 Closer to Eliot":"\u2190 More letters";
  document.getElementById("dirRight").textContent=mode==="scholars"?"Distant from Eliot \u2192":"Fewer letters \u2192";

  bgLayer.selectAll("*").remove();
  labelLayer.selectAll("*").remove();
  lineEl.attr("x1",0).attr("x2",PW);

  labels.forEach((t,i)=>{
    const x1=xScale(t.x-1),x2=xScale(t.x+1);
    bgLayer.append("rect").attr("x",x1).attr("y",-4).attr("width",x2-x1).attr("height",PH+8)
      .attr("fill",i%2===0?"rgba(61,50,41,0.025)":"transparent").attr("rx",3);
    labelLayer.append("text").attr("x",xScale(t.x)).attr("y",PH+20).attr("text-anchor","middle")
      .attr("font-size",12).attr("font-weight",700).attr("fill","#3d3229").attr("font-family","'Cormorant Garamond',serif").text(t.label);
    if(t.sub){
      labelLayer.append("text").attr("x",xScale(t.x)).attr("y",PH+34).attr("text-anchor","middle")
        .attr("font-size",10).attr("fill","rgba(61,50,41,0.4)").attr("font-family","'Cormorant Garamond',serif").text(t.sub);
    }
  });
}

function render(){
  //Dim circles
  const dimData=nodes.filter(d=>!isVisible(d));
  const dimSel=dimLayer.selectAll("circle").data(dimData,d=>d.id);
  dimSel.exit().remove();
  dimSel.enter().append("circle").merge(dimSel)
    .attr("cx",d=>d.x).attr("cy",d=>d.y).attr("r",d=>d.r)
    .attr("fill","rgba(61,50,41,0.06)").attr("stroke","rgba(61,50,41,0.08)").attr("stroke-width",0.5);

  //Visible circles
  const visData=nodes.filter(d=>isVisible(d)).sort((a,b)=>a.closeness-b.closeness);
  const dotSel=dotLayer.selectAll("g.dot").data(visData,d=>d.id);
  dotSel.exit().remove();
  const enter=dotSel.enter().append("g").attr("class","dot").style("cursor","pointer");
  enter.append("circle");
  enter.append("text").attr("pointer-events","none").attr("text-anchor","middle")
    .attr("font-size",11).attr("font-weight",700).attr("fill","#3d3229").attr("font-family","'DM Sans'");

  const merged=enter.merge(dotSel);
  merged.each(function(d){
    const gEl=d3.select(this);
    const isHov=hoveredId===d.id;
    const anyHov=hoveredId!==null;
    const highlighted=search&&d.name.toLowerCase().includes(search);
    const color=CLOSE_COLORS[d.closeness];
    const drawR=Math.max(d.r,5);

    gEl.select("circle")
      .attr("cx",d.x).attr("cy",d.y).attr("r",isHov?drawR+1.5:drawR)
      .attr("fill",color)
      .attr("opacity",anyHov?(isHov?0.92:0.25):highlighted?0.95:0.8)
      .attr("stroke",isHov?"#3d3229":highlighted?"#3d3229":"rgba(250,246,241,0.6)")
      .attr("stroke-width",isHov?2.5:highlighted?2:0.8);

    gEl.select("text")
      .attr("x",d.x).attr("y",d.y-drawR-6)
      .text(d.name).attr("display",isHov?"block":"none");
  });

  //Hover
  merged.on("mouseenter",function(ev,d){hoveredId=d.id;render();showTip(d);})
    .on("mouseleave",function(){hoveredId=null;render();hideTip();});

  //Purple on top
  merged.sort((a,b)=>a.closeness-b.closeness);
}

function showTip(d){
  tipLayer.selectAll("*").remove();
  const cW=200,cH=42;
  let cx=d.x-cW/2,cy=d.y+d.r+12;
  if(cy+cH>PH)cy=d.y-d.r-cH-12;
  if(cx<0)cx=4;
  if(cx+cW>PW)cx=PW-cW-4;
  const tier=d.closeness<=2?"Very Close":d.closeness<=4?"Close":d.closeness<=6?"Moderate":d.closeness<=8?"Distant":"Very Distant";
  tipLayer.append("rect").attr("x",cx).attr("y",cy).attr("width",cW).attr("height",cH).attr("rx",4).attr("fill","#3d3229").attr("opacity",0.95);
  tipLayer.append("text").attr("x",cx+10).attr("y",cy+17).attr("font-size",11.5).attr("font-weight",700).attr("fill","#f5f0ea").attr("font-family","'DM Sans'").text(d.name);
  tipLayer.append("text").attr("x",cx+10).attr("y",cy+32).attr("font-size",10).attr("fill","rgba(245,240,234,0.7)").attr("font-family","'DM Sans'").text(d.letters+" letters \xb7 "+tier+" \xb7 "+d.rel);
}
function hideTip(){tipLayer.selectAll("*").remove();}

updateLabels();
</script></body></html>
