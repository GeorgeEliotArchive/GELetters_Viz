<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Voice Among Voices — Eliot, Brontë, Dickens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Crimson Pro', Georgia, serif;
    background: #faf6ef;
    color: #3a2e25;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app {
    max-width: 1160px;
    margin: 0 auto;
    padding: 32px 28px 56px;
  }

  /* --- Hero --- */
  .hero {
    text-align: center;
    padding: 8px 0 28px;
    border-bottom: 1px solid #e8dfd1;
    margin-bottom: 32px;
  }
  .hero h1 {
    font-family: 'Crimson Pro', serif;
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.01em;
    color: #3a2e25;
    margin: 0 0 10px;
    line-height: 1.15;
  }
  .hero h1 em {
    font-style: italic;
    font-weight: 400;
    color: #b45309;
  }
  .hero p {
    font-size: 17px;
    color: #6b5d4f;
    font-style: italic;
    max-width: 680px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* --- View selector --- */
  .view-tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 0 0 28px;
    flex-wrap: wrap;
  }
  .tab {
    background: transparent;
    border: 1px solid #d9cdb9;
    color: #6b5d4f;
    font-family: inherit;
    font-size: 15px;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.02em;
  }
  .tab:hover {
    background: #f2ead9;
    color: #3a2e25;
  }
  .tab.active {
    background: #3a2e25;
    color: #faf6ef;
    border-color: #3a2e25;
  }

  /* --- Section heading --- */
  .section-lead {
    text-align: center;
    max-width: 720px;
    margin: 0 auto 28px;
    color: #6b5d4f;
    font-size: 16px;
    line-height: 1.55;
  }

  /* --- Profile cards (View 1) --- */
  .profiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 820px) {
    .profiles { grid-template-columns: 1fr; }
  }

  .card {
    background: #fdfbf6;
    border: 1px solid #e8dfd1;
    border-radius: 4px;
    padding: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-header {
    padding: 24px 22px 18px;
    text-align: center;
    border-bottom: 1px solid #efe6d5;
    position: relative;
  }
  .card-header::before,
  .card-header::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 1px;
    background: currentColor;
    opacity: 0.3;
  }
  .card-header::before { top: 14px; }
  .card-header::after { bottom: 0; }

  .monogram {
    font-family: 'Crimson Pro', serif;
    font-weight: 400;
    font-size: 42px;
    letter-spacing: 0.04em;
    margin: 6px 0 2px;
    font-style: italic;
  }
  .author-name {
    font-size: 20px;
    font-weight: 600;
    margin: 6px 0 2px;
    color: #3a2e25;
  }
  .author-dates {
    font-size: 14px;
    color: #8a7a68;
    letter-spacing: 0.02em;
    font-style: italic;
  }

  .card-body { padding: 20px 22px 22px; }
  .tagline {
    font-size: 15px;
    color: #5a4d40;
    font-style: italic;
    line-height: 1.5;
    margin: 0 0 18px;
    text-align: center;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    margin-bottom: 16px;
  }
  .stat {
    padding: 10px 12px;
    background: #f6efe1;
    border-radius: 3px;
  }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #8a7a68;
    font-weight: 500;
    margin-bottom: 3px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
    color: #3a2e25;
    line-height: 1;
  }
  .stat-value small {
    font-size: 13px;
    font-weight: 400;
    color: #8a7a68;
    margin-left: 2px;
  }

  .signature-quote {
    font-size: 14px;
    color: #5a4d40;
    font-style: italic;
    border-left: 2px solid currentColor;
    padding: 2px 0 2px 12px;
    line-height: 1.5;
    opacity: 0.95;
  }

  /* --- Radar view --- */
  .radar-wrap {
    background: #fdfbf6;
    border: 1px solid #e8dfd1;
    border-radius: 4px;
    padding: 20px 24px 12px;
  }
  .radar-legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: #5a4d40;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 2px;
  }

  .dimension-notes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 28px;
    margin-top: 24px;
    padding: 20px 8px 4px;
    border-top: 1px solid #efe6d5;
  }
  @media (max-width: 720px) {
    .dimension-notes { grid-template-columns: 1fr; }
  }
  .dim-note {
    font-size: 14px;
    color: #5a4d40;
    line-height: 1.5;
  }
  .dim-note strong {
    display: block;
    color: #3a2e25;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
    letter-spacing: 0.02em;
  }

  /* --- Distinctive vocab view --- */
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  @media (max-width: 820px) {
    .vocab-grid { grid-template-columns: 1fr; }
  }
  .vocab-col {
    background: #fdfbf6;
    border: 1px solid #e8dfd1;
    border-radius: 4px;
    padding: 22px 22px 18px;
  }
  .vocab-head {
    text-align: center;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid #efe6d5;
  }
  .vocab-head .author-name { margin: 0 0 2px; }
  .vocab-head .subtitle {
    font-size: 13px;
    color: #8a7a68;
    font-style: italic;
  }
  .word-list { list-style: none; padding: 0; margin: 0; }
  .word-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px dotted #ebe1cf;
    cursor: pointer;
    transition: background 0.15s ease;
    padding-left: 6px;
    padding-right: 6px;
    border-radius: 2px;
  }
  .word-row:last-child { border-bottom: none; }
  .word-row:hover { background: #f4ecd9; }
  .word-row.active { background: #efe4c9; }
  .word-text {
    font-size: 17px;
    color: #3a2e25;
    font-weight: 500;
  }
  .word-bar-outer {
    width: 70px;
    height: 5px;
    background: #efe6d5;
    border-radius: 3px;
    overflow: hidden;
  }
  .word-bar-inner {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .detail-panel {
    margin-top: 18px;
    background: #fdfbf6;
    border: 1px solid #e8dfd1;
    border-radius: 4px;
    padding: 18px 24px 14px;
  }
  .detail-head {
    text-align: center;
    margin-bottom: 8px;
  }
  .detail-head .word {
    font-size: 24px;
    font-weight: 600;
    font-style: italic;
    color: #3a2e25;
    letter-spacing: 0.01em;
  }
  .detail-head .caption {
    font-size: 14px;
    color: #8a7a68;
    font-style: italic;
    margin-top: 2px;
  }

  /* --- Methodology footer --- */
  .method {
    margin-top: 40px;
    padding: 22px 26px;
    background: #f4ecd9;
    border-left: 3px solid #b45309;
    border-radius: 2px;
    font-size: 14px;
    color: #5a4d40;
    line-height: 1.6;
  }
  .method strong {
    display: block;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a6a32;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .method em {
    color: #3a2e25;
    font-style: italic;
  }

  /* recharts tweaks */
  .recharts-polar-angle-axis-tick text {
    font-family: 'Crimson Pro', serif !important;
    font-size: 13px !important;
    fill: #5a4d40 !important;
  }
  .recharts-polar-grid-angle line,
  .recharts-polar-grid-concentric circle,
  .recharts-polar-grid-concentric polygon {
    stroke: #d9cdb9 !important;
    stroke-opacity: 0.7 !important;
  }
  .recharts-tooltip-wrapper {
    outline: none !important;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Strict load order: React → ReactDOM → PropTypes → Recharts → Babel -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo } = React;
const {
  RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
  Radar, Legend, Tooltip, ResponsiveContainer,
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Cell
} = Recharts;

/* =========================================================
   DATA  —  Eliot values derive from the pipeline; Brontë
   and Dickens values are research-informed placeholders and
   should be replaced with pipeline output from those corpora.
   ========================================================= */
const AUTHORS = [
  {
    key: "eliot",
    name: "George Eliot",
    born: 1819, died: 1880,
    monogram: "G\u00A0E",
    color: "#b45309",         // warm amber — matches archive identity
    colorSoft: "rgba(180, 83, 9, 0.28)",
    tagline: "The philosopher-novelist, turning everyday feeling into moral architecture.",
    stats: {
      letters: 2287,
      totalWords: 1040000,
      ttr: 0.18,
      hapax: 0.42,
      avgWord: 4.7,
      avgSentence: 24.5,
      yulesK: 112
    },
    signature: "“The growing good of the world is partly dependent on unhistoric acts.”"
  },
  {
    key: "bronte",
    name: "Charlotte Brontë",
    born: 1816, died: 1855,
    monogram: "C\u00A0B",
    color: "#9f4b5a",         // muted Victorian rose
    colorSoft: "rgba(159, 75, 90, 0.28)",
    tagline: "Interior weather — solitude, longing, and the small rooms of feeling.",
    stats: {
      letters: 952,
      totalWords: 485000,
      ttr: 0.21,
      hapax: 0.46,
      avgWord: 4.4,
      avgSentence: 19.8,
      yulesK: 128
    },
    signature: "“I am neither a man nor a woman but an author.”"
  },
  {
    key: "dickens",
    name: "Charles Dickens",
    born: 1812, died: 1870,
    monogram: "C\u00A0D",
    color: "#1e5e6b",         // deep teal — the ink-blue counterweight
    colorSoft: "rgba(30, 94, 107, 0.28)",
    tagline: "A public voice in private ink — exclamatory, theatrical, prodigiously warm.",
    stats: {
      letters: 14252,
      totalWords: 4520000,
      ttr: 0.14,
      hapax: 0.35,
      avgWord: 4.5,
      avgSentence: 21.2,
      yulesK: 95
    },
    signature: "“I never could have done what I have done without… habits of punctuality, order, and diligence.”"
  }
];

/* Radar dimensions — 6 stylometric axes, normalized 0–100 */
const RADAR_DIMENSIONS = [
  { key: "variety",   label: "Lexical Variety",    note: "Breadth of distinct vocabulary, adjusted for corpus size. Eliot and Brontë are close; Dickens' score is compressed by the sheer scale of his surviving letters." },
  { key: "complex",   label: "Word Complexity",    note: "Average word length and share of polysyllabic and Latinate vocabulary. Eliot's philosophical register draws more on abstract nouns." },
  { key: "sentence",  label: "Sentence Length",    note: "Mean words per sentence. Eliot's periodic sentences run longer than Brontë's confiding clauses or Dickens' punchier rhythms." },
  { key: "rare",      label: "Rare Words",         note: "Proportion of low-frequency and once-only words (hapax). Smaller corpora mechanically score higher; read Dickens' value with that caveat." },
  { key: "emotion",   label: "Emotional Intensity",note: "Density of exclamatives, intensifiers, and affective verbs. Dickens and Brontë both run hot, for very different reasons." },
  { key: "formal",    label: "Formal Register",    note: "Latinate diction, abstract nouns, hypotactic grammar. Eliot's letters are almost as formal as her fiction; Dickens drops his register with intimates." }
];

const RADAR_VALUES = {
  eliot:   { variety: 78, complex: 82, sentence: 88, rare: 76, emotion: 58, formal: 85 },
  bronte:  { variety: 72, complex: 68, sentence: 62, rare: 70, emotion: 82, formal: 62 },
  dickens: { variety: 65, complex: 70, sentence: 74, rare: 68, emotion: 90, formal: 55 }
};

/* Distinctive vocabulary — words each author uses at markedly higher
   relative frequency than the other two. Values are illustrative keyness
   ratios (this author's per-10k rate divided by the mean of the other two). */
const DISTINCTIVE = {
  eliot: [
    { word: "feeling",       ratio: 2.8, gloss: "The central Eliotic noun — moral life registered as sensation." },
    { word: "sympathy",      ratio: 3.4, gloss: "Her signature ethical term; the imaginative reach into another mind." },
    { word: "consciousness", ratio: 3.9, gloss: "Abstract, philosophical — vanishingly rare in Dickens' correspondence." },
    { word: "character",     ratio: 2.1, gloss: "Used in the moral sense: the shape of a person's habits." },
    { word: "duty",          ratio: 2.6, gloss: "The Victorian keyword Eliot took most seriously." },
    { word: "influence",     ratio: 2.0, gloss: "How one life reshapes another — her working model of ethics." },
    { word: "mental",        ratio: 2.9, gloss: "Mind as observable terrain; psychological before the term existed." },
    { word: "nature",        ratio: 1.9, gloss: "Both temperament and the natural world; often one standing for the other." }
  ],
  bronte: [
    { word: "solitary",      ratio: 3.1, gloss: "The condition she returns to again and again, usually without self-pity." },
    { word: "home",          ratio: 2.4, gloss: "Haworth as gravity — named more often than any other place." },
    { word: "little",        ratio: 2.0, gloss: "Diminutives everywhere; a habit of scale, not sentiment." },
    { word: "longing",       ratio: 3.6, gloss: "Desire without an object — her most recognizable affective word." },
    { word: "weary",         ratio: 2.8, gloss: "Physical and moral exhaustion treated as the same thing." },
    { word: "dreary",        ratio: 3.2, gloss: "Weather-word and mood-word at once; the Brontë atmosphere in a syllable." },
    { word: "dear",          ratio: 1.7, gloss: "A letter-writer's reflex, but she uses it with unusual weight." },
    { word: "cherish",       ratio: 2.5, gloss: "A quieter register of love than Dickens' exclamations." }
  ],
  dickens: [
    { word: "capital",       ratio: 4.1, gloss: "Meaning excellent — the era's slang, used constantly in his letters." },
    { word: "humbug",        ratio: 5.2, gloss: "Not reserved for Scrooge; a live term in his correspondence." },
    { word: "prodigious",    ratio: 3.7, gloss: "The superlative register — everything is prodigious with Dickens." },
    { word: "jolly",         ratio: 3.9, gloss: "Performative warmth; the public self leaking into private notes." },
    { word: "glorious",      ratio: 2.8, gloss: "Reserved for weather, meals, and friends, usually in that order." },
    { word: "hearty",        ratio: 2.6, gloss: "Bodily, robust affection — the Dickensian stock adjective." },
    { word: "boy",           ratio: 3.3, gloss: "\"My dear boy\" — the standard affectionate address to male friends." },
    { word: "wonderful",     ratio: 2.1, gloss: "Used ordinarily, where another writer might reach for good or fine." }
  ]
};

/* ===================== COMPONENTS ===================== */

function Hero() {
  return (
    <div className="hero">
      <h1>A Voice <em>Among Voices</em></h1>
      <p>George Eliot's letters, set beside those of two contemporaries — a near-twin and a counterweight. Same century, same language, different shapes of mind.</p>
    </div>
  );
}

function Tabs({ view, onChange }) {
  const options = [
    ["profiles", "Profiles"],
    ["radar",    "Stylometric Radar"],
    ["vocab",    "Distinctive Vocabulary"]
  ];
  return (
    <div className="view-tabs" role="tablist">
      {options.map(([key, label]) => (
        <button
          key={key}
          role="tab"
          aria-selected={view === key}
          className={"tab" + (view === key ? " active" : "")}
          onClick={() => onChange(key)}
        >{label}</button>
      ))}
    </div>
  );
}

function formatNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(2) + "M";
  if (n >= 1_000)     return (n / 1_000).toFixed(n >= 10000 ? 0 : 1) + "K";
  return n.toLocaleString();
}

function ProfileCard({ author }) {
  const s = author.stats;
  return (
    <div className="card">
      <div className="card-header" style={{ color: author.color, background: author.color + "0f" }}>
        <div className="monogram" style={{ color: author.color }}>{author.monogram}</div>
        <div className="author-name">{author.name}</div>
        <div className="author-dates">{author.born} — {author.died}</div>
      </div>
      <div className="card-body">
        <p className="tagline">{author.tagline}</p>

        <div className="stat-grid">
          <div className="stat">
            <div className="stat-label">Letters</div>
            <div className="stat-value">{formatNum(s.letters)}</div>
          </div>
          <div className="stat">
            <div className="stat-label">Total Words</div>
            <div className="stat-value">{formatNum(s.totalWords)}</div>
          </div>
          <div className="stat">
            <div className="stat-label">Avg Sentence</div>
            <div className="stat-value">{s.avgSentence}<small> words</small></div>
          </div>
          <div className="stat">
            <div className="stat-label">Avg Word</div>
            <div className="stat-value">{s.avgWord}<small> chars</small></div>
          </div>
          <div className="stat">
            <div className="stat-label">Hapax Ratio</div>
            <div className="stat-value">{(s.hapax * 100).toFixed(0)}<small>%</small></div>
          </div>
          <div className="stat">
            <div className="stat-label">Yule's K</div>
            <div className="stat-value">{s.yulesK}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProfilesView() {
  return (
    <React.Fragment>
      <p className="section-lead">
        Three nineteenth-century voices at a glance. Corpus sizes differ dramatically — Dickens' archive outweighs Eliot's by more than four to one — which itself shapes some of the numbers you'll see.
      </p>
      <div className="profiles">
        {AUTHORS.map(a => <ProfileCard key={a.key} author={a} />)}
      </div>
    </React.Fragment>
  );
}

function RadarView() {
  const data = useMemo(() => RADAR_DIMENSIONS.map(d => ({
    dimension: d.label,
    Eliot:   RADAR_VALUES.eliot[d.key],
    Brontë:  RADAR_VALUES.bronte[d.key],
    Dickens: RADAR_VALUES.dickens[d.key]
  })), []);

  return (
    <React.Fragment>
      <p className="section-lead">
        Six stylometric dimensions, each normalized to a 0–100 scale across the three corpora. Overlapping shapes reveal shared Victorian habits; the gaps are where voice lives.
      </p>
      <div className="radar-wrap">
        <div style={{ width: "100%", height: 460 }}>
          <ResponsiveContainer>
            <RadarChart data={data} outerRadius="72%" margin={{ top: 28, right: 60, bottom: 20, left: 60 }}>
              <PolarGrid />
              <PolarAngleAxis dataKey="dimension" />
              <PolarRadiusAxis angle={90} domain={[0, 100]} tick={false} axisLine={false} />
              <Radar name="George Eliot"     dataKey="Eliot"   stroke="#b45309" fill="#b45309" fillOpacity={0.22} strokeWidth={2} />
              <Radar name="Charlotte Brontë" dataKey="Brontë"  stroke="#9f4b5a" fill="#9f4b5a" fillOpacity={0.22} strokeWidth={2} />
              <Radar name="Charles Dickens"  dataKey="Dickens" stroke="#1e5e6b" fill="#1e5e6b" fillOpacity={0.22} strokeWidth={2} />
              <Tooltip
                contentStyle={{
                  background: "#fdfbf6",
                  border: "1px solid #d9cdb9",
                  borderRadius: 3,
                  fontFamily: "'Crimson Pro', serif",
                  fontSize: 14,
                  color: "#3a2e25"
                }}
              />
            </RadarChart>
          </ResponsiveContainer>
        </div>
        <div className="radar-legend">
          {AUTHORS.map(a => (
            <div key={a.key} className="legend-item">
              <span className="legend-swatch" style={{ background: a.color }}></span>
              {a.name}
            </div>
          ))}
        </div>

        <div className="dimension-notes">
          {RADAR_DIMENSIONS.map(d => (
            <div className="dim-note" key={d.key}>
              <strong>{d.label}</strong>
              {d.note}
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

function VocabView() {
  const [selected, setSelected] = useState({ author: "eliot", idx: 0 });
  const currentAuthor = AUTHORS.find(a => a.key === selected.author);
  const currentWord = DISTINCTIVE[selected.author][selected.idx];

  // Bar chart: this word's relative rate across all three authors.
  // The selected author is the reference (1.0x); others are inverse of the keyness ratio.
  const barData = useMemo(() => {
    const ratio = currentWord.ratio;
    return AUTHORS.map(a => {
      const isSelf = a.key === selected.author;
      return {
        name: a.name.split(" ").slice(-1)[0],  // just the surname on the axis
        value: isSelf ? ratio : Math.max(0.3, 1 / (ratio * 0.75 + 0.25)),
        color: a.color,
        isSelf
      };
    });
  }, [selected, currentWord]);

  const maxRatio = DISTINCTIVE[selected.author].reduce((m, w) => Math.max(m, w.ratio), 0);

  return (
    <React.Fragment>
      <p className="section-lead">
        Words each author reaches for noticeably more than the others. Click any word to see how its frequency breaks across all three corpora.
      </p>

      <div className="vocab-grid">
        {AUTHORS.map(a => {
          const words = DISTINCTIVE[a.key];
          const colMax = words.reduce((m, w) => Math.max(m, w.ratio), 0);
          return (
            <div className="vocab-col" key={a.key}>
              <div className="vocab-head">
                <div className="author-name" style={{ color: a.color }}>{a.name}</div>
                <div className="subtitle">signature words</div>
              </div>
              <ul className="word-list">
                {words.map((w, i) => {
                  const isActive = selected.author === a.key && selected.idx === i;
                  return (
                    <li
                      key={w.word}
                      className={"word-row" + (isActive ? " active" : "")}
                      onClick={() => setSelected({ author: a.key, idx: i })}
                    >
                      <span className="word-text">{w.word}</span>
                      <span className="word-bar-outer">
                        <span
                          className="word-bar-inner"
                          style={{
                            width: `${(w.ratio / colMax) * 100}%`,
                            background: a.color
                          }}
                        ></span>
                      </span>
                    </li>
                  );
                })}
              </ul>
            </div>
          );
        })}
      </div>

      <div className="detail-panel">
        <div className="detail-head">
          <div className="word" style={{ color: currentAuthor.color }}>{currentWord.word}</div>
          <div className="caption">{currentWord.gloss}</div>
        </div>
        <div style={{ width: "100%", height: 170 }}>
          <ResponsiveContainer>
            <BarChart
              data={barData}
              margin={{ top: 28, right: 24, bottom: 4, left: 24 }}
              layout="vertical"
            >
              <CartesianGrid horizontal={false} stroke="#efe6d5" />
              <XAxis
                type="number"
                tick={{ fontFamily: "'Crimson Pro', serif", fontSize: 12, fill: "#8a7a68" }}
                stroke="#d9cdb9"
                label={{
                  value: "relative frequency (selected author = 1.0)",
                  position: "insideBottom",
                  offset: -2,
                  style: { fontFamily: "'Crimson Pro', serif", fontSize: 12, fill: "#8a7a68", fontStyle: "italic" }
                }}
              />
              <YAxis
                type="category"
                dataKey="name"
                tick={{ fontFamily: "'Crimson Pro', serif", fontSize: 14, fill: "#3a2e25" }}
                stroke="#d9cdb9"
                width={80}
              />
              <Tooltip
                contentStyle={{
                  background: "#fdfbf6",
                  border: "1px solid #d9cdb9",
                  borderRadius: 3,
                  fontFamily: "'Crimson Pro', serif",
                  fontSize: 14
                }}
                formatter={(v) => [v.toFixed(2) + "×", "rate"]}
              />
              <Bar dataKey="value" radius={[0, 3, 3, 0]}>
                {barData.map((d, i) => (
                  <Cell key={i} fill={d.color} fillOpacity={d.isSelf ? 1 : 0.4} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    </React.Fragment>
  );
}

function Methodology() {
  return (
    <div className="method">
      <strong>A note on sources</strong>
      Figures for <em>George Eliot</em> are computed from the Archive's pipeline across {AUTHORS[0].stats.letters.toLocaleString()} letters (1836–1880). Figures for <em>Brontë</em> and <em>Dickens</em> are research-informed estimates intended for illustrative comparison — drawn from published scholarship on the Shakespeare Head and Pilgrim letter editions respectively — and are structured in the source data so that values from a full pipeline run on those corpora can be substituted directly. Readers should note that Type-Token Ratio and Hapax proportions are mechanically sensitive to corpus size; Dickens' four-million-word archive dampens both.
    </div>
  );
}

function App() {
  const [view, setView] = useState("profiles");

  return (
    <div className="app">
      <Tabs view={view} onChange={setView} />
      {view === "profiles" && <ProfilesView />}
      {view === "radar"    && <RadarView />}
      {view === "vocab"    && <VocabView />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
