    function StackTip({ active, payload, label }) {
      if (!active || !payload?.length) return null;
      const d = payload[0]?.payload;
      return (

          <div style={{ fontSize: 13, fontWeight: 700, color: "#b45309" }}>{f?.toFixed(2)} / 9 — {desc}</div>
        </div>
      );
    }

                ))}
              </div>
              <button onClick={() => setShowCPs(p => !p)} style={{ padding: "5px 12px", borderRadius: 16, border: `1.5px solid ${showCPs ? "#b45309" : "#d6cab8"}`, background: showCPs ? "#b4530918" : "transparent", color: showCPs ? "#b45309" : "#9a8a76", cursor: "pointer", fontSize: 11, fontWeight: 500 }}>⬥ Change Points</button>
              <button onClick={() => setShowEvents(p => !p)} style={{ padding: "5px 12px", borderRadius: 16, border: `1.5px solid ${showEvents ? "#22d3ee" : "#d6cab8"}`, background: showEvents ? "#22d3ee18" : "transparent", color: showEvents ? "#0e7490" : "#9a8a76", cursor: "pointer", fontSize: 11, fontWeight: 500 }}>Life Events</button>
            </div>
    
            {/* Chart */}
            <div style={{ background: "#ebe3d6", borderRadius: 14, border: "1px solid #d6cab8", padding: "18px 12px 8px 0" }}>
              {view === "stacked" && (
                <ResponsiveContainer width="100%" height={400}>
                  <AreaChart data={chartData} margin={{ top: 28, right: 18, left: 8, bottom: 8 }} stackOffset="expand">
                    <CartesianGrid strokeDasharray="3 3" stroke="#d6cab8" />
                    <XAxis dataKey="year" tick={{ fill: "#8a7a66", fontSize: 11 }} tickLine={{ stroke: "#c4b8a4" }} axisLine={{ stroke: "#c4b8a4" }} />
                    <YAxis tick={{ fill: "#8a7a66", fontSize: 10 }} tickLine={false} axisLine={false} tickFormatter={v => (v * 100).toFixed(0) + "%"} />
                    <Tooltip content={<StackTip />} />
                    {showCPs && Object.keys(allCPs).map(yr => <ReferenceLine key={yr} x={+yr} stroke="#d97706" strokeDasharray="6 3" strokeWidth={2} label={{ value: yr, position: "top", fill: "#b45309", fontSize: 9, fontWeight: 700 }} />)}
                    {showEvents && LIFE_EVENTS.map(e => <ReferenceLine key={e.year} x={e.year} stroke="#22d3ee" strokeDasharray="2 4" strokeWidth={1} strokeOpacity={0.5} />)}
                    {CATS.map(c => <Area key={c} type="monotone" dataKey={c} stackId="1" stroke={COLORS[c]} fill={COLORS[c]} fillOpacity={0.55} strokeWidth={1} />)}
                    <Brush dataKey="year" height={22} fill="#ebe3d6" stroke="#c4b8a4"><BarChart><Bar dataKey="total" fill="#c4b8a4" /></BarChart></Brush>
                  </AreaChart>
                </ResponsiveContainer>
              )}
    
              {view === "formality" && (
                <div>
                  <div style={{ paddingLeft: 20, fontSize: 12, color: "#7a6a56", marginBottom: 4 }}>Formality Score (2 = intimate, 8 = formal)</div>
                  <ResponsiveContainer width="100%" height={400}>
                    <ComposedChart data={chartData} margin={{ top: 28, right: 18, left: 8, bottom: 8 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#d6cab8" />
                      <XAxis dataKey="year" tick={{ fill: "#8a7a66", fontSize: 11 }} tickLine={{ stroke: "#c4b8a4" }} axisLine={{ stroke: "#c4b8a4" }} />
                      <YAxis domain={[2, 7]} tick={{ fill: "#8a7a66", fontSize: 10 }} tickLine={false} axisLine={false} />
                      <Tooltip content={<FormalityTip />} />
                      {showCPs && FORM_CPS.map(yr => <ReferenceLine key={yr} x={yr} stroke="#d97706" strokeDasharray="6 3" strokeWidth={2} label={{ value: `${yr}`, position: "top", fill: "#b45309", fontSize: 10, fontWeight: 700 }} />)}
                      {showEvents && LIFE_EVENTS.map(e => <ReferenceLine key={e.year} x={e.year} stroke="#22d3ee" strokeDasharray="2 4" strokeWidth={1} strokeOpacity={0.5} />)}
                      {FORM_SEGS.map((seg, i) => (
                        <ReferenceLine key={`seg-${i}`} y={seg.m} stroke="#2563eb" strokeDasharray="8 4" strokeWidth={1.5} strokeOpacity={0.4}
                          label={{ value: `${seg.s}–${seg.e}: ${seg.m.toFixed(1)}`, position: i === 1 ? "insideBottomRight" : "insideTopRight", fill: "#2563eb", fontSize: 10 }} />
                      ))}
                      <Line type="monotone" dataKey="formality" stroke="#b45309" strokeWidth={2.5} dot={{ r: 3, fill: "#b45309" }} activeDot={{ r: 6, fill: "#b45309" }} />
                      <Brush dataKey="year" height={22} fill="#ebe3d6" stroke="#c4b8a4"><BarChart><Bar dataKey="total" fill="#c4b8a4" /></BarChart></Brush>
                    </ComposedChart>
                  </ResponsiveContainer>
                </div>
              )}
            </div>
    
            {/* Formality Segments */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 14, marginTop: 20 }}>
              {FORM_SEGS.map((seg, i) => {
                const prev = i > 0 ? FORM_SEGS[i - 1] : null;
                const pct = prev ? ((seg.m - prev.m) / prev.m * 100) : null;
                const desc = seg.m <= 3.8 ? "Intimate" : seg.m <= 4.5 ? "Warm-Moderate" : "Professional";
                const sc = seg.m <= 3.8 ? "#f43f5e" : seg.m <= 4.5 ? "#f97316" : "#2563eb";
                return (
                  <div key={i} style={{ padding: 18, background: "#ebe3d6", borderRadius: 12, border: "1px solid #d6cab8", borderTop: `3px solid ${sc}` }}>
                    <div style={{ fontSize: 16, fontWeight: 700, color: "#3a2a1a", marginBottom: 4 }}>{seg.s}–{seg.e}</div>
                    <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
                      <span style={{ fontSize: 28, fontWeight: 300, color: sc }}>{seg.m.toFixed(2)}</span>
                      <span style={{ fontSize: 12, color: "#7a6a56" }}>{desc}</span>
                      {pct !== null && <span style={{ fontSize: 12, fontWeight: 600, color: pct > 0 ? "#b45309" : "#10b981" }}>{pct > 0 ? "↑" : "↓"}{Math.abs(pct).toFixed(1)}%</span>}
                    </div>
                    <p style={{ fontSize: 12, color: "#6a5a48", lineHeight: 1.6, margin: 0 }}>
                      {i === 0 && "Early letters to family and Maria Lewis use 'My dear Friend' — moderately formal for a young woman in her evangelical circle."}
                      {i === 1 && "Coventry friendships with the Brays and Hennells bring the most intimate period: 'My dear Sara,' 'My dear Cara' dominate as personal bonds deepen."}
                      {i === 2 && "Professional fame brings formal greetings — 'My dear Sir' to Blackwood, 'Dear Mr. Harrison' to admirers — even as 'Dearest' emerges for close friends."}
                    </p>
                  </div>
                );
              })}
            </div>
    
            {/* Category Cards */}
            <div style={{ fontSize: 13, color: "#7a6a56", marginTop: 22, marginBottom: 10, fontWeight: 600 }}>Greeting Categories — click to expand</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 10 }}>
              {CATS.map(c => {
                const isExp = expandedCat === c;
                const segs = CAT_SEGS[c] || [];
                const cps = CAT_CPS[c] || [];
                const exs = EXAMPLES[c] || [];
                return (
                  <div key={c} onClick={() => setExpandedCat(isExp ? null : c)} style={{ background: isExp ? "#e2d9cc" : "#ebe3d6", borderRadius: 10, border: `1.5px solid ${isExp ? COLORS[c] : "#d6cab8"}`, padding: 14, cursor: "pointer", transition: "all 0.2s" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ width: 10, height: 10, borderRadius: 3, background: COLORS[c] }} />
                        <span style={{ fontSize: 13, fontWeight: 700, color: "#3a2a1a" }}>{c}</span>
                      </div>
                      <span style={{ fontSize: 10, color: "#b45309", fontWeight: 700 }}>{cps.length > 0 ? `CP: ${cps.join(", ")}` : "—"}</span>
                    </div>
                    <div style={{ display: "flex", gap: 5, marginBottom: 8 }}>
                      <span style={{ padding: "2px 8px", borderRadius: 10, fontSize: 10, background: "#f5f0e6", border: "1px solid #d6cab8", color: "#7a6a56" }}>Formality: {FORMALITY_SCORE[c]}/9</span>
                    </div>
                    {/* Examples */}
                    <div style={{ padding: "8px 8px", background: "#f5f0e6", borderRadius: 6, border: "1px solid #d6cab8", marginBottom: 8 }}>
                      <div style={{ fontSize: 9, letterSpacing: 1.5, color: COLORS[c], textTransform: "uppercase", fontWeight: 700, marginBottom: 5 }}>Example Openings</div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                        {exs.slice(0, isExp ? 5 : 3).map((ex, i) => (
                          <span key={i} style={{ padding: "3px 8px", borderRadius: 8, fontSize: 11, fontFamily: "'Crimson Pro', Georgia, serif", fontStyle: "italic", background: `${COLORS[c]}10`, border: `1px solid ${COLORS[c]}25`, color: "#5a4a38" }}>"{ex.raw}" <span style={{ color: "#9a8a76", fontStyle: "normal", fontSize: 10 }}>×{ex.n}</span></span>
                        ))}
                      </div>
                    </div>
                    {/* Segments */}
                    {isExp && segs.length > 0 && segs.map((s, i) => {
                      const pct = i > 0 ? (s.m - segs[i - 1].m) : null;
                      return (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 8px", background: i % 2 === 0 ? "#f5f0e6" : "#e2d9cc", borderRadius: 5, marginBottom: 2 }}>
                          <span style={{ fontSize: 11, color: "#6a5a48" }}>{s.s}–{s.e}</span>
                          <div style={{ display: "flex", gap: 6 }}>
                            <span style={{ fontSize: 11, fontWeight: 700, color: COLORS[c] }}>{s.m.toFixed(1)}%</span>
                            {pct !== null && <span style={{ fontSize: 10, color: pct > 0 ? "#10b981" : "#f97316" }}>{pct > 0 ? "↑" : "↓"}{Math.abs(pct).toFixed(1)}</span>}
                          </div>
                        </div>
                      );
                    })}
                    {!isExp && segs.length > 0 && <div style={{ fontSize: 10, color: "#9a8a76", textAlign: "center" }}>click for segment details ▾</div>}
                  </div>
                );
              })}
            </div>
    
            {/* Recipients */}
            <div style={{ marginTop: 24, background: "#ebe3d6", borderRadius: 14, border: "1px solid #d6cab8", padding: 22 }}>
              <h2 style={{ fontSize: 16, fontWeight: 700, margin: "0 0 4px", color: "#3a2a1a", fontFamily: "'Crimson Pro', Georgia, serif" }}>Greetings by Recipient</h2>
              <p style={{ fontSize: 12, color: "#7a6a56", margin: "0 0 14px" }}>How Eliot calibrated her opening for each relationship. Click to see their most common greetings.</p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 8 }}>
                {Object.entries(RECIPIENTS).map(([name, data]) => (
                  <RecipientCard key={name} name={name} data={data} isSelected={selectedRecip === name} onClick={() => setSelectedRecip(selectedRecip === name ? null : name)} />
                ))}
              </div>
            </div>
    
            {/* Key Findings */}
            <div style={{ marginTop: 22, background: "#ebe3d6", borderRadius: 14, border: "1px solid #d6cab8", padding: 22 }}>
              <h3 style={{ fontSize: 15, fontWeight: 700, color: "#3a2a1a", margin: "0 0 14px", fontFamily: "'Crimson Pro', Georgia, serif" }}>Key Findings</h3>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 14 }}>
                <div style={{ padding: 14, background: "#f5f0e6", borderRadius: 8, borderLeft: "3px solid #10b981" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#10b981", marginBottom: 5 }}>"My dear [name]" Collapses (1851)</div>
                  <p style={{ fontSize: 11, color: "#6a5a48", lineHeight: 1.6, margin: 0 }}>The intimate first-name greeting drops from 47.9% to 11.5% as Eliot leaves her Coventry circle. The greeting that defined her closest friendships becomes a minority form almost overnight.</p>
                </div>
                <div style={{ padding: 14, background: "#f5f0e6", borderRadius: 8, borderLeft: "3px solid #2563eb" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#2563eb", marginBottom: 5 }}>"My dear Sir" Surges (1857)</div>
                  <p style={{ fontSize: 11, color: "#6a5a48", lineHeight: 1.6, margin: 0 }}>As George Eliot becomes a famous author, "My dear Mr/Mrs" rises from 6.8% to 32.4%. Her correspondence with John Blackwood alone accounts for 141 "My dear Sir" greetings.</p>
                </div>
                <div style={{ padding: 14, background: "#f5f0e6", borderRadius: 8, borderLeft: "3px solid #f43f5e" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#f43f5e", marginBottom: 5 }}>"Dearest" Blooms Late (1875)</div>
                  <p style={{ fontSize: 11, color: "#6a5a48", lineHeight: 1.6, margin: 0 }}>Nearly absent for decades, "Dearest [name]" surges to 29.2% after 1875 — reflecting deep bonds with Barbara Bodichon, Elma Stuart, and stepson Charles ("Dearest Boy"), even as formal greetings coexist.</p>
                </div>
              </div>
            </div>
    
            <div style={{ marginTop: 14, padding: 14, fontSize: 10, color: "#9a8a76", lineHeight: 1.6, borderTop: "1px solid #d6cab8" }}>
              <strong style={{ color: "#7a6a56" }}>Methodology:</strong> 1,843 greetings extracted from 2,171 letters (84.9% coverage) via pattern matching on opening lines. Formality scored 2–8 from intimate ("Dearest") to formal ("Dear Sir"). Binary segmentation with BIC penalty. Drag brush to zoom.
            </div>
          </div>
        </div>
      );
    }
    

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
