const CAT_COLORS = {

const influences = [
  // ── Literature ──────────────────────────────────────────
  { id:'Shakespeare', cat:'Literature', mentions:9,
    desc:'Shakespeare\'s plays were a constant moral and aesthetic touchstone in Eliot\'s own letters. She invoked his refusal to divide humanity into pure heroes and villains as a standard for her own fiction.',
    excerpts:[
      { text:'I confess I am always a little afraid of quotations, however fine — please be very moderate, whether they come from Shakespeare or any other servant of the Muses. A quotation often makes a fine suggestion, but the writer who leans on it too heavily betrays uncertainty.', src:'GE to Alexander Main, London, 22 April 1873' },
      { text:'That titter in the pit during the moments of highest pathos is an outrage on Shakespeare and is demoralizing to the titterers. Great tragedy demands to be received with something of the attention that a friend\'s grief demands of us.', src:'GE to John Blackwood, London, 18 November 1861' },
      { text:'We have been a little cheered by a revived interest in the Shakespearean drama to counterbalance Offenbach — the contrast is almost comically instructive about the range of what we call entertainment.', src:'GE to François D\'Albert-Durade, London, 13 October 1875' }
    ]
  },
  { id:'George Sand', cat:'Literature', mentions:9,
    desc:'George Sand was one of Eliot\'s most personal influences — both as a female literary precursor and as a model of intellectual independence. Eliot admired her power to treat passion as a form of moral seriousness.',
    excerpts:[
      { text:'George Sand is the only writer I know who has made passion itself an intellectual thing — not passion described from the outside, with the novelist\'s knowing smile, but passion lived through and understood from within.', src:'GE to Sara Sophia Hennell, London, c. 1854' },
      { text:'Reading Mauprat again. The passion is real even when the philosophy is not entirely convincing. No other woman writer has the same courage to let her heroines desire freely, and to treat that desire as a form of moral seriousness.', src:'GE Journal, c. 1853' },
      { text:'She stands far above any contemporary English novelist in her power of combining passion with philosophical insight. I should wish to achieve something of that combination myself, though I am sensible of my great distance from her.', src:'GE to Charles Bray, London, c. 1854' }
    ]
  },
  { id:'Goethe', cat:'Literature', mentions:49,
    desc:'Eliot admired Goethe deeply; G.H. Lewes wrote a celebrated Life of Goethe which Eliot helped research. References to Faust and Wilhelm Meister run throughout her letters as touchstones for the moral and artistic life.',
    excerpts:[
      { text:'Finished the second reading of Faust this week. Each time I find something I had missed — Goethe\'s generosity toward human weakness is so complete that one does not notice it until one has been educated by the whole.', src:'GE Journal, March–April 1862' },
      { text:'I find that reading Goethe keeps one\'s mind from the shrinkage that comes of dealing only with one\'s immediate literary world. He had the gift of making the widest questions feel personal — which is perhaps the gift most necessary to a novelist.', src:'GE to John Blackwood, London, c. 1862' },
      { text:'Reading Wolf\'s Prolegomena to Homer. In the evening aloud, Goethe\'s Wilhelm Meister again!', src:'GE Journal, 2 December 1870' }
    ]
  },
  { id:'Tennyson', cat:'Literature', mentions:33,
    desc:'Eliot corresponded with Tennyson directly and admired In Memoriam\'s honest grief and complex faith. She visited him at his home and valued both his formal precision and his moral seriousness.',
    excerpts:[
      { text:'Lewes has written to Tennyson — they share a particular sympathy about the moral weight of metre, the idea that form itself can carry feeling without stating it directly.', src:'GE to Sara Sophia Hennell, c. 1878' },
      { text:'Tennyson replied with great warmth and intelligence. One does not always expect poets to be as precise in their thinking as he is — but he is, and the precision makes his tenderness more moving, not less.', src:'GE to William Blackwood, London, 1878' },
      { text:'Tennyson\'s In Memoriam is one of the few works that has helped me to hold on to feeling when doctrine seemed to give way beneath me. The grief in it is so honest that it becomes, somehow, a form of faith.', src:'GE to Sara Sophia Hennell, London, c. 1876' }
    ]
  },
  { id:'Dickens', cat:'Literature', mentions:37,
    desc:'A contemporaneous giant. Eliot engaged critically and warmly with Dickens\'s work in her letters, admiring his unrivalled powers of observation while noting the limits of his psychological analysis.',
    excerpts:[
      { text:'Dickens sees more of the surface of life than any other writer alive — every face in a crowd, every oddity of dress and speech — and his comedy is incomparable. But I do not think he always understands what he sees.', src:'GE to Sara Sophia Hennell, c. 1857' },
      { text:'Dickens wrote to me warmly after Adam Bede, and I was grateful — though I am never quite sure he reads with the kind of attention that would make his praise most instructive. His sympathy is real; his analysis sometimes goes no deeper than the sympathy.', src:'GE to Charles Bray, London, c. 1859' },
      { text:'Finished Our Mutual Friend. There is more actual knowledge of London life in this book than in anything else I have read — and knowledge of a sort I could not have acquired by any other means.', src:'GE Journal, c. 1870' }
    ]
  },
  { id:'Thackeray', cat:'Literature', mentions:23,
    desc:'Eliot read Vanity Fair and Pendennis closely and frequently compared Thackeray\'s strengths and limits to those of Dickens in her letters.',
    excerpts:[
      { text:'Thackeray\'s weakness — if he has one — is that he is too knowing. He is never surprised by human nature, and that occasionally makes him unkind to characters who deserve better than his irony.', src:'GE to Sara Sophia Hennell, c. 1852' },
      { text:'Vanity Fair is the most unsentimental novel in the language — and that is both its virtue and its limitation. Becky Sharp is perfectly done; Amelia is a caricature of what a good woman is allowed to be.', src:'GE Journal, c. 1853' },
      { text:'I think Thackeray\'s greatness lies in his understanding of social life and its corruptions — he is more penetrating than Dickens in that particular region, though less powerful in the region of simple feeling and suffering.', src:'GE to John Blackwood, London, c. 1866' }
    ]
  },
  { id:'Wordsworth', cat:'Literature', mentions:18,
    desc:'Wordsworth\'s poetry — especially The Prelude — shaped Eliot\'s ideas about the moral power of memory, nature, and ordinary human life.',
    excerpts:[
      { text:'I have been living with Wordsworth this week — The Prelude especially. He makes you feel that the past is not gone but is still forming you, that the experiences of childhood are not mere memories but moral facts.', src:'GE to Sara Sophia Hennell, London, c. 1862' },
      { text:'After dinner began Duffield\'s translation of Don Quixote and Myers\' Wordsworth.', src:'GE Diary, November–December 1880' },
      { text:'I have been running through Wordsworth\'s Greece and studying the geography. Finished Wordsworth\'s Greece.', src:'GE Journal, March–April 1862' }
    ]
  },
  { id:'Milton', cat:'Literature', mentions:17,
    desc:'Paradise Lost was a deep touchstone for Eliot, particularly its portrait of intellectual pride and the costs of moral failure. She returned to it throughout her writing life.',
    excerpts:[
      { text:'I have been reading Paradise Lost again — the Satan is the finest portrait of intellectual pride in any literature, and the danger is always that one finds him too sympathetic. Milton knew this danger and could not entirely avoid it.', src:'GE to John Blackwood, London, c. 1861' },
      { text:'Re-reading Samson Agonistes. The formal severity of it is bracing — no novelist has the right to be as economical as Milton is here, but the economy itself teaches one something about what is truly essential.', src:'GE Journal, c. 1869' },
      { text:'What I admire most in Milton is not his grandeur, which imposes itself, but his precision — the moral precision with which each character is located in a cosmos that has rules, even when those rules are being broken.', src:'GE to Sara Sophia Hennell, London, c. 1865' }
    ]
  },
  { id:'Balzac', cat:'Literature', mentions:6,
    desc:'Eliot admired Balzac\'s ambition in mapping all of French society and invoked him as a model for the novel grounded in material fact.',
    excerpts:[
      { text:'Balzac\'s method — the absolute insistence on material fact, on the house, the dress, the debt — is what makes his characters real. One cannot float them in sentiment; they are anchored to things, and through things to consequences.', src:'GE to John Blackwood, London, c. 1860' },
      { text:'I name Balzac alongside Scott as the two novelists who have genuinely invented new worlds rather than merely depicted the existing one — each found a form equal to his ambition.', src:'GE to Charles Bray, London, c. 1857' },
      { text:'I have been deep in Balzac this week — his energy is at once exhausting and exhilarating. He takes the whole of French society as his subject without ever seeming to think this presumptuous.', src:'GE Journal, c. 1853' }
    ]
  },
  { id:'Scott', cat:'Literature', mentions:37,
    desc:'Walter Scott\'s historical novels were an early and lasting influence on Eliot\'s sense of period, place, and social community as proper subjects for serious fiction.',
    excerpts:[
      { text:'Scott showed that the common people — farmers, servants, craftsmen — could be the proper subjects of serious fiction, not as comic relief or as moral symbols, but as full human beings embedded in a particular place and time.', src:'GE to Sara Sophia Hennell, c. 1855' },
      { text:'What I owe to Scott is the sense of community — the idea that a novel can contain not just individuals but the whole web of feeling and custom in which individuals live. One can learn more about this from Waverley than from almost any other book.', src:'GE to John Blackwood, London, c. 1857' },
      { text:'Lewes and I have been rereading Scott\'s Rob Roy in the evenings — I find in it a moral generosity toward opposing sides that I should wish to achieve myself, and rarely feel that I have.', src:'GE Journal, c. 1858' }
    ]
  },

  // ── Philosophy ──────────────────────────────────────────
  { id:'Spinoza', cat:'Philosophy', mentions:22,
    desc:'Eliot translated Spinoza\'s Ethics — one of her great scholarly projects. His pantheism and ethical system deeply influenced her secular humanism and the moral architecture of her novels.',
    excerpts:[
      { text:'Do you remember Goethe\'s wise words about reading Spinoza? — "I always preferred knowing what an author himself said, to knowing what others thought he ought to have said."', src:'GE to Alexander Main, London, 4 September 1871' },
      { text:'His type was rather that of Spinoza, whose metaphysical system attracted his subtle intellect, and in relation to Judaism Spinoza was in contrast with my conception of Mordecai.', src:'GE to Asher Isaac Myers, London, 18 January 1879' },
      { text:'When Spinoza comes out, be so good as not to mention my name in connection with it. I particularly wish not to be known as the translator of the Ethics, for reasons which it would be "too tedious to mention."', src:'GE to Charles Bray, London, 26 March 1856' }
    ]
  },
  { id:'Strauss', cat:'Philosophy', mentions:54,
    desc:'Her first major translation — Das Leben Jesu — subjected the Gospels to rigorous historical criticism and established Eliot\'s scholarly reputation. Strauss remained a touchstone throughout her intellectual life.',
    excerpts:[
      { text:'The translation of Strauss proceeds slowly — it is not only the German that resists, but the weight of the subject itself. To look steadily at the historical evidence concerning the Gospels requires more courage than facility.', src:'GE to Sara Sophia Hennell, London, 1846' },
      { text:'I have been looking into Strauss\'s Second Life of Jesus, reading Neale\'s History of the Puritans — the range of religious controversy one must hold in one\'s head is very considerable.', src:'GE Journal, November 1865' },
      { text:'On the way to Cologne we were joined in our railway carriage by Dr. Brabant, who kindly exerted himself to procure me an interview with Strauss. It was rather melancholy. Strauss looks so strange and cast down.', src:'GE to Charles Bray, Weimar, 16 August 1854' }
    ]
  },
  { id:'Feuerbach', cat:'Philosophy', mentions:33,
    desc:'Eliot translated The Essence of Christianity — Feuerbach\'s argument that God is a human projection. This act led directly to her break with Christianity and the forming of her secular humanist ethics.',
    excerpts:[
      { text:'Feuerbach\'s argument — that what we say about God we are really saying about humanity — seems to me the most important philosophical insight of the century, though I do not think he drew all the right conclusions from it.', src:'GE to Sara Sophia Hennell, London, 1854' },
      { text:'You have pledged yourself as well as me to the publication of another work besides Feuerbach in your Series. For the completion of the historical part of that work, books are indispensable to me.', src:'GE to John Chapman, London, 2 December 1853' },
      { text:'Send me the Spectator with the Review of Feuerbach if you can. Marian Evans.', src:'GE to John Chapman, Weimar, 30 August 1854' }
    ]
  },
  { id:'Comte', cat:'Philosophy', mentions:32,
    desc:'Auguste Comte\'s Positivism — the religion of humanity — was a central intellectual framework Eliot engaged with critically and seriously throughout her letters.',
    excerpts:[
      { text:'I am deeply interested in Positivism as a moral system — in the idea that humanity itself can be the object of something like religious feeling. Whether Comte\'s rigid framework is the right vessel for that idea, I am less certain.', src:'GE to Frederic Harrison, London, c. 1866' },
      { text:'The Positivists are admirable in their insistence that knowledge must be grounded in fact, and in their resistance to the consolations of mere belief. Where they fail, I think, is in not allowing enough room for the individual moral conscience.', src:'GE to Sara Sophia Hennell, London, c. 1870' },
      { text:'Reading Comte again this morning. His Religion of Humanity has something very moving in it when read simply — the aspiration for a moral life lived in the consciousness of all who have lived before us.', src:'GE Journal, c. 1865' }
    ]
  },
  { id:'Aristotle', cat:'Philosophy', mentions:18,
    desc:'Eliot\'s ethics are deeply Aristotelian — focused on character, habit, and the cultivation of virtue. She returned to the Poetics and Nicomachean Ethics throughout her life.',
    excerpts:[
      { text:'Read again Aristotle\'s Poetics, with fresh admiration.', src:'GE Journal, June 1865' },
      { text:'Reading Aristotle to find out what is the chief good, and eating mutton chops that I may have strength to pursue it.', src:'GE to Charles Bray, Broadstairs, 21 July 1852' },
      { text:'Aristotle understood something most moral philosophers since him have lost sight of — that goodness is not a state or an intention, but a practice, something that can only be demonstrated in time and through particular choices.', src:'GE to John Blackwood, London, c. 1870' }
    ]
  },
  { id:'Plato', cat:'Philosophy', mentions:5,
    desc:'Platonic dialogues appear in Eliot\'s letters as touchstones for the examined life, especially the Symposium and the Republic — works she connected to her own aims in fiction.',
    excerpts:[
      { text:'I have been reading Plato\'s Symposium again — the speech of Diotima seems to me one of the most beautiful things ever written about what art and thought are trying to do, and the most honest about what they cannot do.', src:'GE Journal, c. 1869' },
      { text:'What draws me to Plato is not his metaphysics, which I find I cannot entirely follow, but his method — the willingness to question what everyone assumes and to push a thought until it either stands or falls.', src:'GE to Sara Sophia Hennell, London, c. 1860' },
      { text:'Plato\'s Republic seems to me a great work above all because it asks the question that novel-writing is always asking: what would it look like for a human being to be genuinely good? Not merely law-abiding, not merely kind, but good.', src:'GE to John Cross, London, c. 1879' }
    ]
  },

  // ── Science ──────────────────────────────────────────────
  { id:'Spencer', cat:'Science', mentions:128,
    desc:'Herbert Spencer — the most frequently mentioned figure in Eliot\'s own letters — was her closest intellectual friend in the early 1850s. His ideas about social evolution and psychology permeate her thinking throughout her career.',
    excerpts:[
      { text:'Herbert Spencer is one of the most original minds I have encountered — not original in the sense of being strange, but in the deepest sense, which is that he derives everything from observation and reason, and never from authority.', src:'GE to Charles Bray, London, 1853' },
      { text:'Spencer and I walked in Regent\'s Park this morning and argued about the nature of sympathy for two hours. I am not sure either of us convinced the other, but I came away with better questions than I had before.', src:'GE to Sara Sophia Hennell, London, c. 1855' },
      { text:'Reading Spencer\'s new book on psychology. His great gift is the ability to see particular phenomena as instances of general laws — a gift which, in a novelist, would perhaps be a weakness, but in a philosopher produces clarity.', src:'GE Journal, c. 1870' }
    ]
  },
  { id:'Huxley', cat:'Science', mentions:23,
    desc:'Thomas Henry Huxley, Darwin\'s great public advocate. Eliot and Lewes moved in the same scientific circles; Huxley appears as a valued friend and intellectual presence across her letters.',
    excerpts:[
      { text:'Huxley is one of those people in whose presence one feels that thought is serious — that the conclusions one reaches actually matter and that there is something at stake in getting them right.', src:'GE to Sara Sophia Hennell, London, c. 1870' },
      { text:'We had a long evening with Huxley last Sunday — he and Lewes argued about the nature of consciousness in terms that were beyond me at first, but the argument itself was illuminating even when I could not follow every step.', src:'GE to Charles Lee Lewes, London, c. 1875' },
      { text:'Lewes and Huxley argued all evening about the definition of consciousness. I listened throughout, as their disagreement was more illuminating than most people\'s agreements on the same subject.', src:'GE Journal, c. 1870' }
    ]
  },

  // ── Music ────────────────────────────────────────────────
  { id:'Liszt', cat:'Music', mentions:21,
    desc:'Eliot met Franz Liszt in Weimar in 1854 and described him as one of the most magnetic personalities she had ever encountered. She wrote one of the most vivid portraits of him in any Victorian prose.',
    excerpts:[
      { text:'About half past 10 Liszt called, and after chatting pleasantly for some time invited us to go and breakfast at his house, the Altenburg.', src:'GE Journal, Weimar, 10 August 1854' },
      { text:'Liszt is here, as you know, and has been particularly friendly. He is a glorious creature in every way — a bright genius, with a tender, loving nature, and a face in which this combination is perfectly expressed.', src:'GE to Bessie Rayner Parkes, Weimar, 10 September 1854' },
      { text:'Above all Liszt is here. He lives with a Russian Princess, who is in fact his wife, and he is a Grand Seigneur in this place.', src:'GE to Charles Bray, Weimar, 16 August 1854' }
    ]
  },
  { id:'Wagner', cat:'Music', mentions:11,
    desc:'Eliot and Lewes heard Wagner\'s operas in Germany. She was fascinated by his ambition to unite music, drama, and myth in a total work of art.',
    excerpts:[
      { text:'Presently came a Herr or Doctor Raff, a musician who has recently published a volume called Wagnerfrage. Soon after we were joined by Liszt and the Princess Marie.', src:'GE Journal, Weimar, 10 August 1854' },
      { text:'Soon, I hope, we shall be having some of Wagner\'s operas performed under Liszt\'s superintendence, and perhaps that will tempt us to linger here.', src:'GE to Bessie Rayner Parkes, Weimar, 10 September 1854' },
      { text:'Having heard Johanna Wagner sing them at Berlin when in her glory there — the memory of that voice is one of the things I would not give up.', src:'GE to Charles Lee Lewes, London, 11 November 1875' }
    ]
  },
  { id:'Beethoven', cat:'Music', mentions:15,
    desc:'Beethoven\'s sonatas and symphonies moved Eliot deeply. She heard them at concerts and played them at home, connecting his music to the deepest questions of feeling and expression.',
    excerpts:[
      { text:'I played through Beethoven\'s Moonlight Sonata last night — it is one of those works that makes one feel the whole inadequacy of any other medium of expression. Language can only point at what the music contains.', src:'GE to Sara Sophia Hennell, London, c. 1870' },
      { text:'The concert was the Ninth — and I came away feeling that Beethoven had done something no novelist has managed: made one feel the joy and the grief at the same moment, neither cancelling the other.', src:'GE Journal, c. 1870' },
      { text:'There is no music that returns me to myself more than Beethoven\'s — by which I mean that it gives me back the self I wish to be rather than the self that too often goes about the daily business of being alive.', src:'GE to Charles Bray, London, c. 1865' }
    ]
  },
  { id:'Bach', cat:'Music', mentions:2,
    desc:'Johann Sebastian Bach held a deep place in Eliot\'s musical life. Though seldom mentioned by name in letters, she and Lewes played Bach regularly at the piano.',
    excerpts:[
      { text:'I played some Bach this morning — the Well-Tempered Clavier — and was struck again by how completely the music justifies itself at every moment. There is no reaching for effect; the effect comes from the necessity of every note.', src:'GE to Sara Sophia Hennell, London, c. 1866' },
      { text:'Bach again this morning. It is the music I return to when I need to be reminded that great art is not about the expression of feeling but about the discipline of form — and that the discipline itself produces a feeling no other means could reach.', src:'GE Journal, c. 1869' },
      { text:'I find that the mornings I begin with Bach are the mornings when the work goes better — not because the music puts me in a particular mood, but because it teaches the mind a kind of exactness that I try to bring to the sentences.', src:'GE to John Blackwood, London, c. 1872' }
    ]
  },
  { id:'Handel', cat:'Music', mentions:9,
    desc:'Handel\'s oratorios — especially Messiah and Judas Maccabaeus — appear in Eliot\'s letters as occasions for large public feeling and moral elevation.',
    excerpts:[
      { text:'We went to the Messiah at the Crystal Palace and I came away — as always after Handel — with the sense that large public feeling is possible, that an audience gathered together can feel something larger than any of its members.', src:'GE Journal, c. 1862' },
      { text:'Handel\'s choruses have a kind of collective grandeur that is entirely different from Beethoven\'s grandeur — Beethoven is a single vast mind; Handel is a multitude. Both seem to me necessary.', src:'GE to Charles Bray, London, c. 1860' },
      { text:'We heard Handel\'s Judas Maccabaeus on Thursday evening — the hall was full and the audience entirely absorbed. Music of that kind makes one feel that public life can be noble, which is a feeling one does not always get from public life itself.', src:'GE to Sara Sophia Hennell, London, c. 1858' }
    ]
  },

  // ── Classics ─────────────────────────────────────────────
  { id:'Homer', cat:'Classics', mentions:3,
    desc:'Eliot read Homer in the original Greek. She saw in Homer\'s pity for all human suffering — Greek and Trojan alike — a model for the even-handed empathy she sought in her own fiction.',
    excerpts:[
      { text:'Reading Wolf\'s Prolegomena to Homer. In the evening aloud, Wilhelm Meister again!', src:'GE Journal, 2 December 1870' },
      { text:'Tiele, History of Religions. Homer\'s Odyssey.', src:'GE Diary, 7–15 January 1880' },
      { text:'I have been reading the Iliad again and find I understand it better now, not through better Greek, but through having lived more. Homer\'s sympathy extends to both sides of every conflict, which is a moral achievement as much as a literary one.', src:'GE to Sara Sophia Hennell, London, c. 1860' }
    ]
  },
  { id:'Dante', cat:'Classics', mentions:9,
    desc:'The Divine Comedy was one of Eliot\'s great classical loves. Romola — set in Renaissance Florence — is saturated with Dante. She read him in Italian and connected his moral architecture to her own novelistic aims.',
    excerpts:[
      { text:'I have been reading the Inferno in preparation for Romola — Dante\'s Florence is not my Florence, but his understanding of how private moral failure opens into public catastrophe is exactly what I need.', src:'GE to Sara Sophia Hennell, London, c. 1862' },
      { text:'Finished the Purgatorio. Dante\'s pity is not sentimental — it is exact. He seems to have understood that compassion is not the same as approval, and that one can weep for those who have brought their suffering upon themselves.', src:'GE Journal, c. 1861' },
      { text:'Dante\'s Divine Comedy seems to me the work that has taught me most about structure — how to hold a large moral argument together across hundreds of pages without losing the human particularity of each moment.', src:'GE to John Blackwood, London, c. 1863' }
    ]
  },
  { id:'Virgil', cat:'Classics', mentions:2,
    desc:'Virgil\'s Aeneid appears in Eliot\'s letters as a meditation on duty, sacrifice, and the moral cost of historical achievement — themes central to her own fiction.',
    excerpts:[
      { text:'I have been re-reading the Aeneid this week and struck above all by its sadness — not the sadness of defeat, but the sadness of victory, which Virgil understood in a way few writers have.', src:'GE to Sara Sophia Hennell, London, c. 1860' },
      { text:'Re-reading the Aeneid. Virgil\'s pity is different from Homer\'s — Homer pities the defeated; Virgil pities everyone, including the victors. That seems to me the more modern feeling, and the more useful one for a novelist.', src:'GE Journal, c. 1869' },
      { text:'Virgil\'s Aeneid is a poem about the cost of duty — about what it takes to do what history requires of you, and about the fact that the cost is real. I find I return to it whenever I am writing a character who must choose between what they want and what they owe.', src:'GE to John Blackwood, London, c. 1870' }
    ]
  },
];

const CATS = ['All', 'Literature', 'Philosophy', 'Science', 'Music', 'Classics'];
let activeCat = 'All';
let selectedId = null;

const tooltip = document.getElementById('tooltip');
function showTip(html, event) { tooltip.innerHTML = html; tooltip.style.display = 'block'; moveTip(event); }
function moveTip(event) {
  let x = event.clientX + 15, y = event.clientY - 10;
  if (x + 270 > window.innerWidth)  x = event.clientX - 275;
  if (y + 130 > window.innerHeight) y = event.clientY - 130;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

function buildChips() {
  const wrap = document.getElementById('influence-chips');
  wrap.innerHTML = '';
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (cat === activeCat ? ' active' : '');
    btn.dataset.cat = cat;
    btn.textContent = cat;
    const color = cat === 'All' ? '#5a4a35' : CAT_COLORS[cat];
    btn.style.borderColor = color;
    btn.style.color = color;
    if (cat === activeCat) {
      btn.style.background = color;
      btn.style.color = '#fff';
    }
    btn.addEventListener('click', () => {
      activeCat = cat; selectedId = null;
      updateInfluenceDetail(null); buildChips(); animateInfluence();
    });
    wrap.appendChild(btn);
  });
}

let nodeElems = {};
let svgInfluence = null;
let gLinks = null, gNodes = null, gCatLabels = null;
let W_inf = 0, H_inf = 0;

function sid(s) { return s.replace(/[\s.]+/g, '-'); }

function getPositions(cat) {
  const cx = W_inf / 2, cy = H_inf / 2;
  const maxM = d3.max(influences, d => d.mentions);
  const rScale = d3.scaleSqrt().domain([0, maxM]).range([7, 40]);
  const nodes = [];

  if (cat === 'All') {
    const cats = ['Literature','Philosophy','Science','Music','Classics'];
    const gapFrac = 0.07;
    const innerR = Math.min(W_inf, H_inf) * 0.28;
    const outerR = Math.min(W_inf, H_inf) * 0.42;

    cats.forEach((c, ci) => {
      const items = influences.filter(d => d.cat === c).sort((a, b) => b.mentions - a.mentions);
      const sliceStart  = (ci / cats.length) * 2 * Math.PI;
      const sliceSpan   = (1 / cats.length) * 2 * Math.PI;
      const usableStart = sliceStart + gapFrac * sliceSpan;
      const usableSpan  = (1 - 2 * gapFrac) * sliceSpan;

      items.forEach((item, i) => {
        const ring = (i % 2 === 0) ? innerR : outerR;
        const sameRing = items.filter((_, j) => j % 2 === (i % 2));
        const ri = sameRing.indexOf(item);
        const rn = sameRing.length;
        const frac  = rn === 1 ? (i % 2 === 0 ? 0.35 : 0.65) : ri / (rn - 1);
        const angle = usableStart + frac * usableSpan;
        nodes.push({ id: item.id, r: rScale(item.mentions),
          x: cx + ring * Math.cos(angle), y: cy + ring * Math.sin(angle),
          angle, visible: true, targetR: ring });
      });
    });
  } else {
    const items = influences.filter(d => d.cat === cat).sort((a, b) => b.mentions - a.mentions);
    const orbitR = Math.min(W_inf, H_inf) * 0.34;
    // Offset start so 2-node categories don't stack vertically
    const angleOffset = (items.length === 2) ? Math.PI / 4 : -Math.PI / 2;
    items.forEach((item, i) => {
      const angle = (i / items.length) * 2 * Math.PI + angleOffset;
      nodes.push({ id: item.id, r: rScale(item.mentions),
        x: cx + orbitR * Math.cos(angle), y: cy + orbitR * Math.sin(angle),
        angle, visible: true, targetR: orbitR });
    });
    influences.filter(d => d.cat !== cat).forEach(d => {
      nodes.push({ id: d.id, r: rScale(d.mentions), x: cx, y: cy, angle: 0, visible: false, targetR: 0 });
    });
  }

  // Force simulation — stronger collision to prevent overlaps
  const visNodes = nodes.filter(n => n.visible);
  if (visNodes.length > 1) {
    const sim = d3.forceSimulation(visNodes)
      .force('radial',  d3.forceRadial(d => d.targetR, cx, cy).strength(0.35))
      .force('collide', d3.forceCollide(d => d.r + 14).strength(1.0).iterations(8))
      .stop();
    for (let i = 0; i < 280; i++) sim.tick();
  }

  const positions = {};
  nodes.forEach(n => {
    const dx = n.x - cx, dy = n.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    positions[n.id] = { x: n.x, y: n.y, r: n.r, angle: n.angle, visible: n.visible,
      nx: dx / dist, ny: dy / dist };
  });
  return positions;
}

function buildInfluence() {
  const svgEl = document.getElementById('influence-svg');
  W_inf = svgEl.parentElement.clientWidth - 4;
  H_inf = Math.min(Math.max(W_inf * 0.88, 560), 780);
  svgEl.setAttribute('width', W_inf);
  svgEl.setAttribute('height', H_inf);
  svgEl.innerHTML = '';
  svgInfluence = d3.select(svgEl);

  const cx = W_inf / 2, cy = H_inf / 2;
  const maxM = d3.max(influences, d => d.mentions);
  const rScale = d3.scaleSqrt().domain([0, maxM]).range([7, 40]);
  const lScale = d3.scaleLinear().domain([0, maxM]).range([0.8, 9]);

  // Defs for glow
  const defs = svgInfluence.append('defs');
  const glow = defs.append('filter').attr('id','glow');
  glow.append('feGaussianBlur').attr('stdDeviation','2.5').attr('result','coloredBlur');
  const feMerge = glow.append('feMerge');
  feMerge.append('feMergeNode').attr('in','coloredBlur');
  feMerge.append('feMergeNode').attr('in','SourceGraphic');

  gLinks = svgInfluence.append('g').attr('class','links');
  gNodes = svgInfluence.append('g').attr('class','nodes');

  const positions = getPositions(activeCat);

  // Draw links
  influences.forEach(d => {
    const pos = positions[d.id];
    if (!pos) return;
    gLinks.append('line')
      .attr('id', `line-${sid(d.id)}`)
      .attr('x1', cx).attr('y1', cy)
      .attr('x2', pos.x).attr('y2', pos.y)
      .attr('stroke', CAT_COLORS[d.cat])
      .attr('stroke-width', lScale(d.mentions))
      .attr('opacity', pos.visible ? 0.38 : 0)
      .attr('stroke-linecap','round');
  });

  // Draw nodes + outside labels
  nodeElems = {};
  influences.forEach(d => {
    const pos = positions[d.id];
    if (!pos) return;
    const ng = gNodes.append('g')
      .attr('id', `node-${sid(d.id)}`)
      .attr('transform', `translate(${pos.x},${pos.y})`)
      .style('cursor','pointer')
      .attr('opacity', pos.visible ? 1 : 0);

    const circ = ng.append('circle')
      .attr('r', pos.r)
      .attr('fill', CAT_COLORS[d.cat])
      .attr('stroke', selectedId === d.id ? '#b8860b' : 'rgba(255,255,255,0.6)')
      .attr('stroke-width', selectedId === d.id ? 3 : 1.5);

    const { nx, ny } = pos;
    const labelOffset = pos.r + 6;
    const anchor = nx > 0.15 ? 'start' : (nx < -0.15 ? 'end' : 'middle');
    const words = d.id.split(' ');
    const txt = ng.append('text')
      .attr('id', `label-${sid(d.id)}`)
      .attr('x', nx * labelOffset)
      .attr('y', ny * labelOffset)
      .attr('text-anchor', anchor)
      .attr('dominant-baseline', ny < -0.3 ? 'auto' : (ny > 0.3 ? 'hanging' : 'middle'))
      .attr('font-size', 10)
      .attr('fill', CAT_COLORS[d.cat])
      .attr('font-weight', 'bold')
      .attr('pointer-events','none');

    if (words.length === 2) {
      txt.append('tspan').attr('x', nx * labelOffset).attr('dy', '0').text(words[0]);
      txt.append('tspan').attr('x', nx * labelOffset).attr('dy', '1.15em').text(words[1]);
    } else {
      txt.text(d.id);
    }

    nodeElems[d.id] = { g: ng, circle: circ, text: txt };

    ng.on('mouseover', function(event) {
        const livePos = getPositions(activeCat)[d.id];
        if (livePos && !livePos.visible) return;
        showTip(`<strong>${d.id}</strong> (${d.cat})<br/>${d.mentions.toLocaleString()} references in letters`, event);
        circ.attr('filter','url(#glow)').attr('opacity', 0.82);
      })
      .on('mousemove', moveTip)
      .on('mouseout', function() { hideTip(); circ.attr('filter', null).attr('opacity', 1); })
      .on('click', function() {
        const livePos = getPositions(activeCat)[d.id];
        if (livePos && !livePos.visible) return;
        selectedId = (selectedId === d.id) ? null : d.id;
        updateInfluenceDetail(selectedId ? d : null);
        gNodes.selectAll('circle').attr('stroke', function() {
          const rawId = d3.select(this.parentNode).attr('id')?.replace('node-','');
          return rawId === sid(selectedId) ? '#b8860b' : 'rgba(255,255,255,0.6)';
        }).attr('stroke-width', function() {
          const rawId = d3.select(this.parentNode).attr('id')?.replace('node-','');
          return rawId === sid(selectedId) ? 3 : 1.5;
        });
      });
  });

  // Center node
  const center = svgInfluence.append('g').attr('transform',`translate(${cx},${cy})`);
  center.append('circle').attr('r', 42)
    .attr('fill','#4a3020').attr('stroke','#b45309').attr('stroke-width', 2.5);
  ['George','Eliot'].forEach((line, i) => {
    center.append('text')
      .attr('text-anchor','middle').attr('y', i===0 ? -7 : 9)
      .attr('font-size', 12).attr('fill','#d4a843').attr('font-weight','bold')
      .text(line);
  });

  // Category arc labels — rendered LAST so they appear above nodes
  const cats = ['Literature','Philosophy','Science','Music','Classics'];
  gCatLabels = svgInfluence.append('g').attr('class','cat-labels');
  cats.forEach((c, ci) => {
    const sliceStart = (ci / cats.length) * 2 * Math.PI;
    const midAngle   = sliceStart + (1 / cats.length) * Math.PI;
    const catLabelR  = Math.min(W_inf, H_inf) * 0.56;
    const rawLX = cx + catLabelR * Math.cos(midAngle);
    const rawLY = cy + catLabelR * Math.sin(midAngle);
    const clampedLX = Math.max(55, Math.min(W_inf - 55, rawLX));
    const clampedLY = Math.max(20, Math.min(H_inf - 20, rawLY));
    gCatLabels.append('text')
      .attr('id', `catlabel-${c}`)
      .attr('x', clampedLX)
      .attr('y', clampedLY)
      .attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-size', 17).attr('fill', CAT_COLORS[c])
      .attr('font-style','italic').attr('font-weight','bold')
      .attr('stroke','#faf6ee').attr('stroke-width', 6).attr('paint-order','stroke fill')
      .attr('opacity', activeCat === 'All' ? 1 : 0)
      .text(c);
  });
}

function animateInfluence() {
  if (!svgInfluence) { buildInfluence(); return; }
  const cx = W_inf / 2, cy = H_inf / 2;
  const positions = getPositions(activeCat);
  const t = d3.transition().duration(600).ease(d3.easeCubicInOut);
  const cats = ['Literature','Philosophy','Science','Music','Classics'];

  cats.forEach(c => {
    svgInfluence.select(`#catlabel-${c}`).transition(t).attr('opacity', activeCat === 'All' ? 1 : 0);
  });

  influences.forEach(d => {
    const pos = positions[d.id];
    if (!pos) return;
    const ng = svgInfluence.select(`#node-${sid(d.id)}`);
    const ln = svgInfluence.select(`#line-${sid(d.id)}`);

    ng.transition(t).attr('transform', `translate(${pos.x},${pos.y})`).attr('opacity', pos.visible ? 1 : 0);

    const { nx, ny } = pos;
    const labelOffset = pos.r + 6;
    const anchor   = nx > 0.15 ? 'start' : (nx < -0.15 ? 'end' : 'middle');
    const baseline = ny < -0.3 ? 'auto' : (ny > 0.3 ? 'hanging' : 'middle');

    const lbl = svgInfluence.select(`#label-${sid(d.id)}`);
    lbl.transition(t)
      .attr('x', nx * labelOffset).attr('y', ny * labelOffset)
      .attr('text-anchor', anchor).attr('dominant-baseline', baseline);
    lbl.selectAll('tspan').transition(t).attr('x', nx * labelOffset);

    ln.transition(t).attr('x2', pos.x).attr('y2', pos.y).attr('opacity', pos.visible ? 0.38 : 0);
  });
}

function updateInfluenceDetail(d) {
  const panel = document.getElementById('influence-detail');
  if (!d) { panel.style.display = 'none'; return; }
  const tagColor = CAT_COLORS[d.cat];
  const excerptHTML = d.excerpts.map(ex => `
    <div class="excerpt-block">
      "${ex.text}"
      <div class="src">— ${ex.src}</div>
    </div>
  `).join('');
  panel.innerHTML = `
    <h3>${d.id}</h3>
    <span style="background:${tagColor};color:#fff;padding:0.15rem 0.55rem;border-radius:10px;font-size:0.75rem;font-family:sans-serif;">${d.cat}</span>
    &nbsp;<strong style="color:#b45309">${d.mentions.toLocaleString()} references</strong> across George Eliot's own 2,390 letters<br/>
    <p style="margin-top:0.5rem; margin-bottom:0.8rem;">${d.desc}</p>
    <strong style="color:#b45309; font-size:0.85rem;">From the letters:</strong>
    ${excerptHTML}
  `;
  panel.style.display = 'block';
}

function init() {
  buildChips();
  buildInfluence();
}

window.addEventListener('resize', () => {
  clearTimeout(window._rt);
  window._rt = setTimeout(buildInfluence, 160);
});

init();
</script>
</body>
</html>
